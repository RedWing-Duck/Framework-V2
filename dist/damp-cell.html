<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Text RPG Framework</title>
<style>
:root{--bg:#e6e8e3;--fg:#22262b;--dim:#6b7178;--accent:#8a5a00;--npc:#2f5d8a;--item:#3d6b3a;--err:#a4262c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1e24;--fg:#d8dcd2;--dim:#7d8590;--accent:#e0a84a;--npc:#7fb2e5;--item:#8cc78a;--err:#ff8a80}}
:root[data-theme="dark"]{--bg:#1a1e24;--fg:#d8dcd2;--dim:#7d8590;--accent:#e0a84a;--npc:#7fb2e5;--item:#8cc78a;--err:#ff8a80}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.55 ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;display:flex;flex-direction:column}
#out,form{width:100%;max-width:42rem;margin:0 auto;box-sizing:border-box;padding:1rem}
#out{flex:1;overflow-y:auto}
#out p{margin:0 0 .75rem;white-space:pre-wrap}
.cmd{color:var(--dim)}
.title{font-weight:600}
.npc,.item{font-weight:600}
.npc{color:var(--npc)}
.item{color:var(--item)}
#st{width:100%;max-width:42rem;margin:0 auto;box-sizing:border-box;padding:.5rem 1rem;color:var(--dim);border-bottom:1px solid var(--dim);white-space:pre-wrap}
form{display:flex;gap:.5rem;border-top:1px solid var(--dim)}
input{flex:1;font:inherit;color:inherit;background:transparent;border:0;outline:0}
form:focus-within{border-top-color:var(--accent)}
#menu{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:1rem;width:100%;max-width:42rem;margin:0 auto;padding:1rem;box-sizing:border-box}
#menu h1{font-size:2rem;margin:0 0 1rem;color:var(--accent)}
#menu button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--dim);padding:.6rem 1.5rem;min-width:12rem;text-align:left;cursor:pointer}
#menu button:hover,#menu button:focus-visible{border-color:var(--accent);color:var(--accent);outline:0}
[hidden]{display:none!important}
#err{color:var(--err);border-left:3px solid var(--err);padding-left:1rem;margin:0;white-space:pre-wrap;font:inherit;font-size:.875rem;max-height:40vh;overflow:auto}
#ask{display:flex;flex-direction:column;gap:1rem}
#ask p{margin:0;max-width:30rem}
body.playing #menu,body:not(.playing) #out,body:not(.playing) #st,body:not(.playing) form{display:none}
</style>
</head>
<body>
<div id="menu"><h1 id="mt"></h1><pre id="err" hidden></pre><button id="bs">Start</button><button id="bc" hidden>Continue</button>
  <div id="ask" hidden><p>This will start a new game. Previous saved data will be lost.</p><button id="by">Yes</button><button id="bn">No</button></div></div>
<div id="st" hidden></div>
<div id="out" aria-live="polite"></div>
<form id="f"><span class="title">&gt;</span><input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" aria-label="Command" autofocus></form>

<script>
const G = (() => {
// Game data reference: docs/AUTHORING.md
const G = {
  title: "The Damp Cell",
  intro: "You wake on cold stone. Your head aches. You need to get out.",
  start: "cell",
  rooms: {
    cell: { name: "Cell", exits: { east: "corridor", down: "cellar" },
      up: "Wet stone, and a slit of a window far too high to reach.", down: "The trapdoor in the corner, its iron ring cold with damp.",   // "look up" / "look down"
      desc: "A cramped stone cell, damp [straw] on the floor. A trapdoor in the corner leads down. The iron door to the east hangs open a crack." },
    cellar: { name: "Cellar", dark: true, exits: { up: "cell" }, up: "The underside of the trapdoor, and a faint grey square of light.", desc: [   // "dark" comes from the light add-on
      { if: { here: "bread" }, text: "A low cellar that reeks of mold. A heel of [bread] sits on a shelf." },
      "A low cellar that reeks of mold. Empty shelves line the walls." ] },
    corridor: { name: "Corridor", up: "Torch smoke, blackening the ceiling.", desc: [
      { if: { flag: "gate_open" }, text: "A torchlit corridor. The gate to the north stands wide open." },
      { if: { here: "guard" }, text: "A torchlit corridor. A [guard] slouches beside a heavy gate to the north." },
      "A torchlit corridor. A heavy gate blocks the way north." ],
      exits: { west: "cell", north: { to: "yard", if: { flag: "gate_open" }, fail: "The gate is locked tight." } } },
    yard: { name: "Courtyard", desc: "Fresh night air. The walls are behind you.", up: "Stars. More of them than you remember." }
  },
  items: {
    bread: { name: "stale bread", at: "cellar", aliases: ["loaf", "heel"], desc: "Hard as a rock, but food is food." },
    straw: { name: "straw", at: "cell", fixed: true, level: "down", desc: "Damp and useless." },   // level: "look down" shows it
    lantern: { name: "lantern", at: "corridor", light: true, desc: "An oil lantern, burning steadily." },
    key: { name: "iron key", desc: "Heavy and rusted. It might fit the gate.",
      on: { use: [{ if: { in: "corridor", not: { flag: "gate_open" } }, say: "The key turns with a groan. The gate swings open.", set: "gate_open", mark: "gate" }] } }
  },
  npcs: {
    rat: { name: "rat", at: "cell", pronoun: "it", level: "down", desc: "Fat, grey, and entirely unbothered by you." },   // "it", not "him"/"her"
    guard: { name: "Guard", at: "corridor", pronoun: "him", props: { annoyed: 0 }, desc: [   // props: his own counter, "guard.annoyed"
      { if: { flag: "fed" }, text: "Crumbs on his chin. He looks almost friendly." },
      { if: { has: "bread" }, text: "Bored and clearly hungry. He keeps eyeing your [bread]." },
      "Bored and clearly hungry." ],
      topics: {   // "ask guard about the gate"; "*" answers anything else
        "gate|door": [{ if: { flag: "gate_open" }, say: "\"What gate? I never saw a gate.\"" }, "\"Stays locked. Orders.\""],
        "key|keys": "He pats his belt. \"Mine.\"",
        "*": "He shrugs. \"Don't know, don't care.\"" },
      // "give the bread to the guard", "give him the bread": the two slots. {the:what} is the thing offered.
      on: { give: [{ if: { what: "bread" }, take: "bread", give: "key", set: "fed", say: "He snatches it. \"Food! ...Here. I never saw you.\"" },
        "He doesn't want {the:what}." ] },
      dialogue: {
        start: { text: [{ if: { flag: "fed" }, text: "Thanks for the bread. Now scram." },
          { if: { min: { "guard.annoyed": 2 } }, text: "You again? Ask me that once more, I dare you." }, "What do you want, prisoner?"], options: [
          { text: "Offer the bread.", if: { has: "bread" }, take: "bread", give: "key", set: "fed", next: "thanks" },
          { text: "Let me out!", if: { not: { flag: "fed" } }, add: { "guard.annoyed": 1 }, next: "no" },
          { text: "Nothing." } ] },
        thanks: { text: "Food! ...Here. I never saw you." },
        no: { text: "Ha! Not a chance." } } }
  },
  verbs: { give: { carry: true } },   // "give" takes the bread first when it's lying here
  messages: { arrives: "{A} scurries in.", leaves: "{The} scurries out." },   // only the rat moves silently
  events: [
    { every: 2, move: { rat: ["cell", "corridor"] } },   // says nothing, so messages.arrives / leaves narrate it
    { if: { flag: "gate_open" }, say: "The [guard] shrugs and wanders off down the corridor.", move: { guard: null } },
    { if: { in: "yard" }, end: "You escaped in {turns} turns! THE END." },
    { if: { since: { gate: 2 } }, say: "Shouts echo from somewhere above. Someone heard the gate." },
    { if: { since: { gate: 4 } }, end: "Guards flood the corridor. You're caught after {turns} turns. THE END." }
  ]
};
return G;
})();
</script>

<script>
/* =====================================================================
   ENGINE v2 — reuse as-is. A game is data (G, see docs/AUTHORING.md);
   new mechanics are add-ons (addon({...}), see docs/ADDONS.md).
   Conditions, effects, commands and messages live in the COND, EFFECT,
   CMDS and MSG tables, which add-ons extend; add-ons react through HOOKS
   and never replace engine functions.

   How a typed line flows:
     parse(raw)   clean the text, echo it, "oops" fixes, run "input" hooks
     act(words)   dialogue numbers, phrasal verbs, aliases, directions,
                  the two slots ("give X to Y"); count the turn (and keep an undo snapshot)
     exec(v, a)   pronouns, the two slots, "before" hooks, "Which do you mean?",
                  "(first taking...)" -> replies (respond) -> "unhandled" hooks
                  -> the built-in command (CMDS) -> the verb's fail line
     then         events, "afterTurn" hooks, the status line, save

   Sections, in order: tables and state · messages · storage · things and
   name matching · print · TEXT · random · COND · EFFECT · replies and
   events · look and movement · dialogue · commands · exec · act and
   parse · start, save, add-ons · validate · menu and boot.
   On load, validate() checks the game data and lists any problems on the
   start menu (and in the browser console) with the exact path.
   ===================================================================== */
const $ = id => document.getElementById(id), out = $("out"), inp = $("in");
const tbl = o => Object.assign(Object.create(null), o);   // no inherited keys: typing "constructor" finds nothing
const own = (o, k) => o && Object.hasOwn(o, k) ? o[k] : undefined;
const DIRS = tbl({ n: "north", s: "south", e: "east", w: "west", u: "up", d: "down", ne: "northeast", nw: "northwest", se: "southeast", sw: "southwest" });
const ALIAS = tbl({ z: "wait", l: "look", i: "inventory", inv: "inventory", x: "examine", get: "take", grab: "take",
  walk: "go", speak: "talk", place: "put", insert: "put", shut: "close", h: "help", g: "again", q: "menu", quit: "menu" });
const PHRASAL = tbl({ "pick up": "take", "look at": "examine", "put down": "drop", "look around": "look" });
const FILLER = ["a", "an", "the", "to", "at", "with", "on"];
const PARTICLES = ["up", "down", "around", "under", "out", "off", "over", "through", "into", "in", "inside", "from", "behind", "beneath"];
const FREE = ["help", "menu", "restart", "again", "undo", "inventory", "transcript", "brief", "verbose"];   // commands that don't cost a turn
const MULTI = ["take", "drop"];                         // commands that take "all" or "X and Y" (one turn for the lot)
const PRONOUNS = ["it", "them", "him", "her"];          // it: the last item; him/her: the last person (or by npcs.X.pronoun); them: the last thing
const NOOBJ = ["inventory", "wait", "help", "again", "undo", "restart", "menu", "go", "transcript", "brief", "verbose"];   // never ask "Which do you mean?" for these
// a word that opens the second slot: "give the bread TO the guard", "open the gate WITH the key" (LINE.what / LINE.with)
const ROLES = ["to", "with", "on", "onto", "in", "into", "inside", "at", "about", "from", "for", "under", "behind"];
const BREAK = ["and", "then", "except", "but", ...ROLES];   // words that end a noun phrase (see named())
const ADDONS = [], CLASH = [], HOOKS = { input: [], before: [], afterTurn: [], start: [], enter: [], end: [], text: [], tag: [], boot: [], validate: [], changed: [], unhandled: [], reach: [] };
// validator tables: REFS = add-on checks per data key; META = keys allowed next to effects;
// MAPS = keys whose own keys are names ("def": each value is a definition, "data": each value is data, "map": a map of maps)
const REFS = tbl({}), META = ["if", "repeat", "every", "text", "next"], MAPS = tbl({ rooms: "def", items: "def", npcs: "def", kinds: "map",
  exits: "data", dialogue: "data", on: "data", topics: "data", props: "data", verbs: "data", messages: "data", conds: "data", aliases: "data", phrasal: "data" });
// S = the game state (plain JSON: saved, undone, restored). SAVE = the Continue snapshot, UNDO = one step back,
// LAST = the last command's words (for "again"), VERBS = every verb the game's data answers, VER = the save version
let S, SAVE = null, UNDO = null, LAST = null, VERBS = new Set(), VER = "";
// S.loc: where each thing is; S.shut: closed holders; S.level: things moved up or down (the level effect);
// S.props: props changed in play ({ guard: { hp: 7 } }; the rest are still the data's, see prop());
// S.it: the last thing acted on; S.pro: what each pronoun means ({ it, him, her, them }); S.pick: the last "Which do you mean?" set and the one chosen (for "the other one", "both");
// S.ask: a command waiting for "Which do you mean?"; S.talk: a conversation waiting for an option
const blank = () => ({ room: G.start, prev: null, loc: {}, shut: {}, flags: {}, count: { turns: 0 }, mark: {}, fired: {},
  seen: {}, been: {}, seq: {}, level: {}, props: {}, seed: G.seed ?? Date.now() % 2147483647, it: null, pro: {}, pick: null, ask: null, talk: null, over: false });
// LINE = the command being answered: said: and {verb}; it = the thing answering ({it}); what = the direct thing and
// with = the second one ("give WHAT to WITH", "use WHAT on WITH"). TURN = whether this command costs a turn, and was refunded.
// ROLE = how the typed line splits around its role word, before filler words were dropped (see roles()).
// LOG = every line printed this session (for "transcript"); PREF = player settings kept apart from the game (brief mode).
const LINE = { verb: "", said: "", it: null, what: null, with: null }, TURN = { cost: false, free: false };
let ROLE = null, PREV = null, ENTERING = false, PREF = {};
const LOG = [];

// ---- messages: every line the engine prints. A game rewords any of them in G.messages (TEXT, variants and rotate work).
const MSG = tbl({
  huh: "I don't understand that. Type 'help'.", over: "The game is over. Type 'restart', 'undo' or 'menu'.",
  help: "Commands: {cmds}.\nDirections: n, s, e, w, u, d, or back (one step: the room you just left).\nAlso: look up, look down, oops <word> (fixes a typo).\nFree actions: {free}.",
  cantGo: "You can't go that way.", blocked: "Something blocks the way.", goWhere: "Go where?",
  notHere: "You don't see that here.", notHave: "You don't have that.", what: "{Verb} what?", cant: "You can't {verb} that.",
  taken: "Taken: {it}", have: "You already have that.", fixed: "You can't take that.", dropped: "Dropped: {it}",
  carry: "You carry: {list}", carryNone: "You carry nothing.", nothing: "Nothing happens.", plain: "You see nothing special.",
  noOne: "No one by that name is here.", silent: "No response.", choose: "Choose a number from the list.", wait: "Time passes.",
  see: "You see: {list}", people: "Here: {list}", exits: "Exits: {list}", received: "(Received: {it})", lost: "(Lost: {it})",
  noAgain: "There's nothing to do again yet.", noUndo: "There's nothing to undo.", undone: "Undone.",
  which: "Which do you mean: {list}?", nothingAll: "There's nothing here to {verb}.",
  putIn: "You put {the} in {the:to}.", putOn: "You put {the} on {the:to}.", cantPut: "You can't put something inside itself.",
  inIt: "In {the}: {list}.", onIt: "On {the}: {list}.", isShut: "{The} is closed.",
  opened: "You open {the}.", closed: "You close {the}.", alreadyOpen: "It's already open.", alreadyClosed: "It's already closed.",
  noTopic: "No answer about that.", firstTake: "(first taking {the})", arrives: "{The} arrives.", leaves: "{The} leaves.",
  noOops: "There's nothing to correct.", levelNone: "Nothing special {dir} there.", levelSee: "{The}: {text}", brief: "Brief descriptions: a room you've seen shows its name and what's there.",
  verbose: "Full descriptions: every room is described in full.", transcript: "Transcript saved: {n} lines.",
  noTranscript: "This browser won't save files, so the transcript can't be saved here."
});
const msg = (k, vars) => txt(own(G.messages, k) ?? MSG[k], vars);

// ---- storage: localStorage when the browser allows it, namespaced by the game's title
const store = (k, v) => { try { v == null ? localStorage.removeItem(G.title + ":" + k) : localStorage.setItem(G.title + ":" + k, JSON.stringify(v)); } catch {} };
const load = k => { try { return JSON.parse(localStorage.getItem(G.title + ":" + k)); } catch { return null; } };

// ---- things: items, npcs, and G.self (the player as a target: "smell me")
const thing = id => own(G.items, id) || own(G.npcs, id) || (id === "self" ? G.self : undefined);
const words = s => String(s).toLowerCase().replace(/-/g, " ").split(/\s+/).filter(Boolean);
const clean = s => words(String(s).replace(/[^\p{L}\p{N}'\s-]+/gu, " "));   // words without punctuation: "north." and "Let me out!"
// a thing's name now: a string, or TEXT variants ({ if, text }) so a name can follow the state ("unlit lamp", "lit lamp")
const nm = id => pick(thing(id)?.name) || id;
const phrases = id => { const o = thing(id); return [id, nm(id), ...(o.aliases || []), ...(id === "self" ? ["me", "myself", "self"] : [])].map(n => words(n).join(" ")); };
// articles: "the [mug]" / "a [mug]", or just "[Tony]" for a proper name (proper:true). article:"an"/"some"/"" sets "a".
const the = id => (thing(id)?.proper ? "" : "the ") + `[${id}]`;
const a1 = id => { const o = thing(id), r = o?.proper ? "" : o?.article ?? (/^[aeiou]/i.test(nm(id)) ? "an" : "a"); return (r ? r + " " : "") + `[${id}]`; };
// every thing in ids that the text names, in the order named. At each word, the longest phrase that is
// an id, a full name or an alias wins ("iron key" before "key"); failing that, any single word of a name.
// Words next to each other narrow one noun: "red mug" is the mug whose words include "red", and "coffee mug" the
// mug that is also coffee. A word that fits none of the candidates so far starts a new noun ("use key door"), and so
// does a word like "and", "to" or "with". A noun that still fits several things carries .amb = { phrase, ids }
// (see "Which do you mean?"); one that a later word narrowed carries .pick = { ids, id } (for "the other one").
function named(a, ids) {
  const w = words(a), hits = [], P = ids.map(id => [id, phrases(id), words(nm(id))]);
  let run = null;   // the noun being read: { ids (still fitting), from (the first word's fits), start, end }
  const close = () => {
    if (!run) return;
    if (run.ids.length > 1 && !hits.amb) hits.amb = { phrase: w.slice(run.start, run.end).join(" "), ids: run.ids };
    if (run.ids.length === 1 && run.from.length > 1 && !hits.pick) hits.pick = { ids: run.from, id: run.ids[0] };
    if (!hits.includes(run.ids[0])) hits.push(run.ids[0]);
    run = null;
  };
  for (let i = 0; i < w.length; i++) {
    if (BREAK.includes(w[i])) { close(); continue; }
    let fit = [], end = i + 1;
    for (let j = w.length; j > i && !fit.length; j--) { const p = w.slice(i, j).join(" "); fit = P.filter(x => x[1].includes(p)); end = j; }
    if (!fit.length) { fit = P.filter(x => x[2].includes(w[i])); end = i + 1; }
    if (!fit.length) continue;   // a word that names nothing (an adjective not in any name) doesn't end the noun
    const f = fit.map(x => x[0]), both = run ? run.ids.filter(id => f.includes(id)) : [];
    if (both.length) Object.assign(run, { ids: both, end }, f.length > run.from.length && { from: f });
    else { close(); run = { ids: f, from: f, start: i, end }; }
    i = end - 1;   // skip the words of the phrase just matched
  }
  close();
  return hits;
}
const find = (a, ids) => named(a, ids)[0];

// ---- where things are. S.loc[id] is a room id, "player" (carried), null (offstage), or the id of a holder:
// an item with holds:"in" (a box, a drawer) or holds:"on" (a table, a shelf). A holder with closed:true or
// false can be opened and closed; what's in a closed one can't be seen or reached.
const at = (T, place = S.room) => Object.keys(T || {}).filter(id => S.loc[id] === place);
const inv = () => at(G.items, "player");
const holder = id => own(G.items, id)?.holds;                               // "in", "on", or undefined
const inside = id => holder(id) && !S.shut[id] ? at(G.items, id) : [];      // what can be seen in or on it
const nested = ids => ids.flatMap(id => [id, ...nested(inside(id))]);       // these, and everything visible in or on them
const where = id => { let p = S.loc[id]; for (let n = 0; holder(p) && n < 50; n++) p = S.loc[p]; return p; };   // the room (or "player") around it
// everything the player can touch or name now: carried, here (through open holders), people here, and self.
// Add-ons' reach hooks filter it (darkness, distance, perception), and every command reads it, so one filter covers every verb.
const reach = () => HOOKS.reach.reduce((r, h) => h(r) || r, [...nested([...inv(), ...at(G.items)]), ...at(G.npcs), ...(G.self ? ["self"] : [])]);
const around = () => { const r = reach(); return [...nested(at(G.items)), ...at(G.npcs)].filter(id => r.includes(id)); };   // in reach and not carried
// "In the [box]: ..." / "On the [table]: ..." for each holder among ids that has something visible
const contents = ids => nested(ids).filter(id => inside(id).length)
  .forEach(id => print(msg(holder(id) === "on" ? "onIt" : "inIt", { it: `[${id}]`, list: names(inside(id)) })));
const names = ids => ids.map(i => `[${i}]`).join(", ");
// ---- props: named numbers and words on any thing (items.X.props, npcs.X.props, self.props). "guard.hp" names one;
// a name without a dot is a game-wide counter (S.count). Changes in play are kept in S.props, over the data's values.
const propKey = k => { const i = k.indexOf("."); return i < 0 ? [null, k] : [k.slice(0, i), k.slice(i + 1)]; };
const prop = k => { const [id, p] = propKey(k);
  return id === null ? S.count[k] || 0 : own(S.props[id], p) ?? own(thing(id)?.props, p); };
const propNum = k => { const v = prop(k); return typeof v === "number" ? v : 0; };
// set a prop or counter (null: back to its data value), and tell the changed hooks
function setProp(k, v) {
  const [id, p] = propKey(k), from = prop(k);
  if (id === null) S.count[k] = v ?? 0; else if (v == null) { if (S.props[id]) delete S.props[id][p]; } else (S.props[id] ??= {})[p] = v;
  changed(id, p, from, prop(k));
}
// where a thing is now (a room, "player", a holder, or null), and the changed hooks hear about it as key "loc"
function setLoc(id, where) { const from = S.loc[id] ?? null; S.loc[id] = where; changed(id, "loc", from, where); }
let DEPTH = 0;   // a changed hook that changes something calls the hooks again; stop a runaway loop
function changed(id, key, from, to) {
  if (from === to || !HOOKS.changed.length) return;
  if (DEPTH > 8) return console.warn(`changed: stopped a loop at ${id ?? ""}.${key}`);
  DEPTH++; try { HOOKS.changed.forEach(h => h(id, key, from, to)); } finally { DEPTH--; }
}
const all = (o, f) => Object.entries(o || {}).every(([k, n]) => f(propNum(k), n, k));
const list = v => [].concat(v);

function print(t, c, plain) {
  for (const h of HOOKS.text) t = h(t, c);
  if (!t) return;                                     // an empty line prints nothing (a message reworded to "")
  const p = document.createElement("p"); if (c) p.className = c;
  (plain ? [t] : t.split(/\[(\w+)\]/)).forEach((s, i) => {   // odd parts are ids from [id]
    const o = i % 2 && thing(s);
    if (!o) return p.append(i % 2 ? `[${s}]` : s);   // unknown id stays visible for the author
    const sp = document.createElement("span");
    sp.className = [own(G.npcs, s) ? "npc" : "item", ...HOOKS.tag.map(h => h(s))].filter(Boolean).join(" ");
    sp.textContent = nm(s); p.append(sp);
  });
  out.append(p); if (LOG.push(p.textContent) > 20000) LOG.shift();   // the transcript keeps what the screen drops
  while (out.children.length > 500) out.firstElementChild.remove();   // very long sessions stay fast
  out.scrollTop = out.scrollHeight;
}

// ---- random: a seeded generator kept in S, so saves, undo and "again" can't re-roll a result.
// rand(n) is a whole number from 0 to n-1. Set G.seed for the same rolls every game (handy in tests).
function rand(n) {
  let t = S.seed = (S.seed + 0x6D2B79F5) | 0;   // mulberry32
  t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return Math.floor(((t ^ (t >>> 14)) >>> 0) / 4294967296 * n);
}

// ---- TEXT: a string, or a list of variants; the first whose "if" passes is shown. A variant can also
// rotate through lines ({ rotate:[...] }), climb them and stay on the last ({ ladder:[...] }), or pick one at random ({ random:[...] }).
const SEQ = new WeakMap();   // rotate/ladder object -> stable id, assigned by validate()'s walk so saves keep their place
function pick(v) {
  for (const x of list(v ?? [])) {
    if (typeof x === "string") return x;
    if (!x || !test(x.if)) continue;
    if (x.random) return pick(x.random[rand(x.random.length)]);
    const L = x.rotate || x.ladder;
    if (!L) return pick(x.text);
    const k = SEQ.get(x) ?? JSON.stringify(L).slice(0, 80), n = S.seq[k] || 0;
    S.seq[k] = n + 1;
    return pick(L[x.rotate ? n % L.length : Math.min(n, L.length - 1)]);
  }

}
const cap = s => s && s[0].toUpperCase() + s.slice(1);
// {name} in a TEXT: a value passed in vars, else {it} (the thing acted on, as a tag), {what}/{with} (the two slots),
// {verb}/{Verb} (the verb typed), else a counter or a prop ({guard.hp}). {the}, {The}, {a}, {A} put an article before {it}, and {the:to}
// before another value that is a tag: "the [mug]", "a [mug]", or "[Tony]" for a proper name.
function fill(k, vars, of) {
  if ((k in vars) && !of) return vars[k];
  if (["the", "The", "a", "A"].includes(k)) {
    const v = String(fill(of || "it", vars)), id = /^\[(\w+)\]$/.exec(v)?.[1], r = id && thing(id) ? (k.toLowerCase() === "the" ? the(id) : a1(id)) : v;
    return k[0] === k[0].toUpperCase() ? cap(r) : r;
  }
  if (k === "it") return LINE.it ? `[${LINE.it}]` : "it";
  if (k === "what" || k === "with") return LINE[k] ? `[${LINE[k]}]` : "";
  if (k === "verb") return LINE.verb;
  if (k === "Verb") return cap(LINE.verb || "do");
  return prop(k) ?? "";   // a counter ({turns}) or a prop ({guard.hp}, {guard.mood})
}
const txt = (v, vars = {}) => pick(v).replace(/\{([\w.]+)(?::(\w+))?\}/g, (m, k, of) => of && !/^(the|a)$/i.test(k) ? m : fill(k, vars, of));
// "the [a], the [b] or the [c]" (no article for a proper name)
const either = ids => ids.map(the).join(", ").replace(/, ([^,]*)$/, " or $1");

// ---- conditions: every key in an "if" must pass. "if" can also be a name from G.conds.
const COND = tbl({
  has: v => list(v).every(id => where(id) === "player"),   // carried, also inside something carried
  here: v => list(v).every(id => where(id) === S.room),     // in this room, also inside something here
  in: v => list(v).includes(S.room),                       // a list: any of these rooms
  flag: v => list(v).every(f => !!S.flags[f]),
  is: v => list(v).every(n => test(own(G.conds, n))),
  seen: v => list(v).every(id => !!S.seen[id]),            // examined at least once
  visited: v => list(v).every(r => !!S.been[r]),           // entered before (true from the first look's end)
  not: v => !test(v),
  any: l => l.some(c => test(c)),
  all: l => l.every(c => test(c)),
  min: o => all(o, (v, n) => v >= n),
  max: o => all(o, (v, n) => v <= n),
  eq: o => all(o, (v, n) => v === n),
  since: o => all(o, (v, n, k) => k in S.mark && S.count.turns - S.mark[k] >= n),
  said: p => list(p).every(q => q === "" ? !LINE.said : q.split("|").some(w => ` ${LINE.said} `.includes(` ${words(w).join(" ")} `))),
  inside: o => Object.entries(o).every(([id, h]) => S.loc[id] === h),   // inside:{ coin:"box" }: directly in or on that holder
  open: v => list(v).every(id => !S.shut[id]),
  level: o => Object.entries(o).every(([id, l]) => levelOf(id) === l),   // level:{ bat: "up" }: where it is now (see "up and down")
  prop: o => Object.entries(o).every(([k, v]) => list(v).includes(prop(k))),   // prop:{ "guard.mood": "angry" } (or a list: any of them)
  what: v => list(v).includes(LINE.what),                   // the direct thing is one of these: "give BREAD to the guard"
  with: v => list(v).includes(LINE.with),                   // the second thing is one of these: "give the bread to the GUARD"
  chance: n => rand(100) < n                               // passes n times in 100 (test() rolls it once per command)
});
// chance is rolled once per condition per command, so checking the same "if" twice in a turn gives one answer
const ROLLS = new Map(), roll = c => { if (!ROLLS.has(c)) ROLLS.set(c, COND.chance(c.chance)); return ROLLS.get(c); };
const test = c => !c ? true : typeof c === "string" ? COND.is(c)
  : Object.keys(c).every(k => k === "chance" ? roll(c) : !own(COND, k) || COND[k](c[k]));

// ---- effects: run in table order; say, do, goto and end always run last
const EFFECT = tbl({
  set: v => list(v).forEach(f => S.flags[f] = true),
  unset: v => list(v).forEach(f => delete S.flags[f]),
  add: o => { for (const k in o) setProp(k, propNum(k) + o[k]); },   // a counter, or a prop: add:{ "guard.hp": -3 }
  mark: v => list(v).forEach(m => S.mark[m] = S.count.turns),
  move: o => { for (const id in o) { const r = o[id], was = shown(id), from = where(id);   // a list is a route: step to the next room
    setLoc(id, Array.isArray(r) ? r[(r.indexOf(S.loc[id]) + 1) % r.length] : r);
    // an event that moves something into or out of sight without saying so gets a line ("The [rat] arrives.")
    if (TELL && was !== shown(id)) print(msg(was ? "leaves" : "arrives", { it: `[${id}]`, dir: exitTo(was ? where(id) : from) })); } },
  take: v => list(v).forEach(id => { setLoc(id, null); print(msg("lost", { it: `[${id}]` }), "cmd"); }),
  give: v => list(v).forEach(id => { setLoc(id, "player"); print(msg("received", { it: `[${id}]` }), "cmd"); }),
  open: v => list(v).forEach(id => delete S.shut[id]),
  close: v => list(v).forEach(id => S.shut[id] = true),
  level: o => { for (const id in o) o[id] == null ? delete S.level[id] : S.level[id] = o[id]; },   // null: back to its data
  prop: o => { for (const k in o) setProp(k, o[k]); },   // prop:{ "guard.mood": "angry", "self.hp": 10 }; null: back to its data
  free: v => { if (v && !TURN.free && TURN.cost) { TURN.free = true; S.count.turns--; } },   // this command costs no turn
  say: v => print(txt(v)),
  do: v => { const [c, ...r] = words(v); exec(c, r.join(" ")); },   // run a command: do:"look"
  goto: v => enter(v),
  end: v => { print(txt(v), "title"); S.over = true; HOOKS.end.forEach(h => h(v)); }
});
const LAST_FX = ["say", "do", "goto", "end"];

// ---- replies and events
// visible in the player's room (listed, not hidden, not in a closed box); the exit from here that leads to room r
const shown = id => !thing(id)?.hidden && around().includes(id);
const exitTo = r => Object.keys(G.rooms[S.room].exits || {}).find(k => dest(G.rooms[S.room].exits[k]) === r) || "";
let TELL = false;   // true while an event that says nothing runs: its moves are narrated
// run one effect object (a string is { say }); stops early once the game has ended
function run(e = {}) {
  if (typeof e === "string") e = { say: e };
  for (const k of [...Object.keys(EFFECT).filter(k => !LAST_FX.includes(k)), ...LAST_FX]) if (k in e && !S.over) EFFECT[k](e[k]);
}
// a REPLY is a TEXT-like list of { if, ...EFFECT } entries (a string = { say }); the first that passes runs
function reply(r) {
  const e = list(r ?? []).find(x => typeof x === "string" || (x && test(x.if)));
  if (e === undefined) return false;
  run(e); return true;
}

// world rules, after every command: each fires once, every time with repeat:true, or on every nth turn with every:n
function events() {
  const tick = S.count.turns !== S.tick; S.tick = S.count.turns;   // every: only on a turn that passed, not after free commands
  (G.events || []).forEach((e, i) => {
    if (S.over) return;
    const due = e.every ? tick && S.count.turns > 0 && S.count.turns % e.every === 0 : e.repeat || !S.fired[i];
    if (due && test(e.if)) { S.fired[i] = true; TELL = !("say" in e || "end" in e); try { run(e); } finally { TELL = false; } }
  });
}

// ---- look and movement
function look() {
  const r = G.rooms[S.room], d = txt(r.desc), extra = T => at(T).filter(id => !T[id].hidden && !d.includes(`[${id}]`));
  const it = extra(G.items), np = extra(G.npcs), ex = Object.keys(r.exits || {}).filter(k => !r.exits[k].hidden);
  print(r.name, "title"); if (!ENTERING) print(d);   // brief mode: a room seen before shows only its name and lists
  if (it.length) print(msg("see", { list: names(it) }));
  contents(at(G.items));   // a hidden holder (scenery) still shows what's on it
  if (np.length) print(msg("people", { list: names(np) }));
  if (ex.length) print(msg("exits", { list: ex.join(", ") }));
}

// up and down: a thing's level ("up" or "down", or TEXT variants) says where it is in the room; the level effect moves
// it and S.level remembers that. "look up" / "look down" shows the room's up/down text, then every thing in sight there,
// named, with its description (message levelSee).
const LEVELS = tbl({ up: "up", u: "up", above: "up", upward: "up", upwards: "up", overhead: "up",
  down: "down", d: "down", below: "down", downward: "down", downwards: "down" });
const levelOf = id => own(S.level, id) ?? (pick(thing(id)?.level) || null);
function lookAt(l) {
  const t = txt(own(G.rooms[S.room], l)), ids = around().filter(id => levelOf(id) === l);
  if (t) print(t);
  for (const id of ids) { print(msg("levelSee", { it: `[${id}]`, text: txt(thing(id).desc) || msg("plain") })); S.seen[id] = true; point(id); }   // "The rat: Fat, grey..."
  if (!t && !ids.length) print(msg("levelNone", { dir: l }));
}

// entering shows the room, then marks it visited (so a desc can tell the first look from later ones), then runs "enter" hooks
function enter(id) {
  S.prev = S.room; S.room = id; S.pick = null; ENTERING = !!PREF.brief && !!S.been[id];   // "the other one" stays in its room
  try { exec("look"); } finally { ENTERING = false; }
  S.been[id] = (S.been[id] || 0) + 1; HOOKS.enter.forEach(h => S.over || h(id)); }
const dest = x => typeof x === "string" ? x : x.to;
const notHere = (k = "notHere") => { EFFECT.free(true); print(msg(k)); };   // naming something that isn't here costs no turn

function go(a) {
  if (!a) return notHere("goWhere");
  const X = G.rooms[S.room].exits || {}, d = own(DIRS, a) || a;
  const k = own(X, d) ? d : Object.keys(X).find(k => {   // "go back", "go to the yard"
    const to = dest(X[k]); return a === "back" ? to === S.prev : to === a || (" " + words(G.rooms[to].name).join(" ")).endsWith(" " + a); });
  if (!k) return notHere("cantGo");
  const e = typeof X[k] === "string" ? { to: X[k] } : X[k];
  test(e.if) ? enter(e.to) : print(txt(e.fail) || msg("blocked"));
}

// ---- dialogue: show a node and its options whose "if" passes; S.talk remembers them until the player answers
function node(npc, id) {
  const n = G.npcs[npc].dialogue[id], opts = (n.options || []).map((o, i) => i).filter(i => test(n.options[i].if));
  print(`[${npc}]: "${txt(n.text)}"`);
  S.talk = opts.length ? { npc, node: id, opts } : null;
  opts.forEach((o, i) => print(`${i + 1}. ${txt(n.options[o].text)}`, "cmd"));
}
// answer the open conversation with option number k (1-based); false if there's no such option
function choose(k) {
  const { npc, node: id, opts } = S.talk, o = G.npcs[npc].dialogue[id].options?.[opts[k - 1]];
  if (!o) return false;
  S.talk = null; run(o); if (o.next && !S.over) node(npc, o.next);
  return true;
}
// "ask guard about the gate", "tell her about the key", "ask about the gate" (the one person here):
// the first key of npcs.X.topics whose phrases ("gate|door") the words contain, else its "*", else noTopic
function topic(a) {
  const w = words(a), i = w.indexOf("about"), who = i < 0 ? a : w.slice(0, i).join(" "), what = ` ${(i < 0 ? w : w.slice(i + 1)).join(" ")} `;
  const P = around().filter(id => own(G.npcs, id)), n = named(who, P)[0] || P.find(id => G.npcs[id].topics) || P[0];   // unnamed: someone with topics
  if (!n) return notHere("noOne");
  const T = G.npcs[n].topics || {}, k = Object.keys(T).find(k => k !== "*" && k.split("|").some(p => what.includes(` ${words(p).join(" ")} `)));
  LINE.it = n;
  reply(own(T, k ?? "*")) || print(msg("noTopic"));
}

// ---- commands: each gets the rest of the typed line and the things it names (in reach)
const CMDS = tbl({
  look(a) { if (own(LEVELS, a)) return lookAt(LEVELS[a]); if (a && !["around", "room", "here"].includes(a)) return exec("examine", a); look(); },
  go,
  take(a, ids) {
    const id = LINE.what || ids[0];   // "take the coin from the box": the direct thing
    if (!id) return notHere();
    if (S.loc[id] === "player") return notHere("have");
    if (thing(id).fixed || !own(G.items, id)) return print(msg("fixed"));
    setLoc(id, "player"); IMPLICIT ? print(msg("firstTake", { it: `[${id}]` }), "cmd") : print(msg("taken", { it: `[${id}]` }));
  },
  drop(a, ids) {
    if (holder(LINE.with)) return exec("put", a);   // "drop the coin in the box"
    const id = LINE.what || ids[0];
    if (!id || S.loc[id] !== "player") return notHere("notHave");
    setLoc(id, S.room); if (levelOf(id)) S.level[id] = "down";   // a thing with a level lands on the floor
    print(msg("dropped", { it: `[${id}]` }));
  },
  // "put X in Y" / "put X on Y" (the holder decides which); "put X down" drops it; on a thing that
  // isn't a holder ("put the plywood on the window") it's "use X on Y", so recipes and replies answer
  put(a, ids) {
    const [x, y] = [LINE.what || ids[0], LINE.with];
    if (!x) return notHere();
    if (!y) return exec("drop", a);
    if (!holder(y)) return exec("use", a);
    if (S.loc[x] !== "player") return notHere("notHave");
    if (S.shut[y]) return print(msg("isShut", { it: `[${y}]` }));
    if (nested([x]).includes(y)) return print(msg("cantPut"));
    setLoc(x, y); print(msg(holder(y) === "on" ? "putOn" : "putIn", { it: `[${x}]`, to: `[${y}]` }));
  },
  open() {
    const id = LINE.it;
    if (!id) return notHere();
    if (!("closed" in thing(id))) return print(msg("cant"));
    if (!S.shut[id]) return notHere("alreadyOpen");
    delete S.shut[id]; print(msg("opened")); contents([id]);
  },
  close() {
    const id = LINE.it;
    if (!id) return notHere();
    if (!("closed" in thing(id))) return print(msg("cant"));
    if (S.shut[id]) return notHere("alreadyClosed");
    S.shut[id] = true; print(msg("closed"));
  },
  inventory() { const i = inv(); print(i.length ? msg("carry", { list: names(i) }) : msg("carryNone")); contents(i); },
  examine(a) {
    if (!a) return exec("look");
    const id = LINE.it;
    if (!id) return notHere();
    print(txt(thing(id).desc) || msg("plain")); contents([id]);
  },
  use() { LINE.it ? print(msg("nothing")) : notHere(); },
  talk(a, ids) {
    const n = a ? ids.find(id => own(G.npcs, id)) : around().find(id => own(G.npcs, id));   // people only: "talk to the coin" finds no one
    if (!n) return notHere("noOne");
    own(G.npcs, n)?.dialogue ? node(n, "start") : print(msg("silent", { it: `[${n}]` }));
  },
  ask: topic,
  tell: topic,
  wait() { print(msg("wait")); },
  help() {
    const cmds = [...new Set([...Object.keys(CMDS), ...VERBS])].filter(c => !own(G.verbs, c)?.hidden);
    print(msg("help", { cmds: cmds.filter(c => !isFree(c)).join(", "), free: cmds.filter(isFree).join(", ") }));
  },
  again() { if (!LAST) return print(msg("noAgain")); print("> " + LAST.join(" "), "cmd", true); act(LAST); },
  undo() { if (!UNDO) return print(msg("noUndo")); S = JSON.parse(UNDO); UNDO = null; print(msg("undone")); exec("look"); },
  restart: () => play(true),
  brief() { PREF.brief = true; store("prefs", PREF); print(msg("brief")); },
  verbose() { PREF.brief = false; store("prefs", PREF); print(msg("verbose")); },
  // the whole session as a text file, for bug reports: every line printed, including what scrolled off the screen
  transcript() {
    try {
      const u = URL.createObjectURL(new Blob([LOG.join("\n") + "\n"], { type: "text/plain" })), l = document.createElement("a");
      l.href = u; l.download = `${G.title} transcript.txt`; document.body.append(l); l.click(); l.remove();
      setTimeout(() => URL.revokeObjectURL(u), 10000);
      print(msg("transcript", { n: LOG.length }));
    } catch { print(msg("noTranscript")); }
  },
  menu
});
const isFree = v => FREE.includes(v) || !!own(G.verbs, v)?.free;

// replies that can answer verb v: the named things' (in slot order, below) and their kind's, then the room's,
// then (when nothing is named) the player's own (G.self: "think", "dance"), then the game's.
// The things a line names, in the order they answer: the second slot, the direct thing, then the rest, last named first
// ("give the bread to the guard" and "give the guard the bread" both ask the guard first)
const bySlot = ids => [LINE.with, LINE.what, ...[...ids].reverse()].filter((id, i, a) => id && a.indexOf(id) === i);
function respond(v, ids) {
  for (const id of bySlot(ids)) {
    const o = thing(id); LINE.it = id;
    if (reply(own(o.on, v)) || reply(own(own(G.kinds, o.kind), v))) return true;
  }
  LINE.it = ids.find(id => own(thing(id).on, v)) || ids[0] || null;
  return reply(own(G.rooms[S.room].on, v)) || (!ids.length && reply(own(G.self?.on, v))) || reply(own(G.on, v));
}

// ---- exec: run verb v on the text a: pronouns, "before" hooks, "Which do you mean?", then replies,
// then the command itself, then the verb's fail line. Hooks come before the question, so an add-on
// with its own idea of what a word means (or darkness) answers first.
function exec(v, a = "", said = a) {
  const role = ROLE?.a === a ? ROLE : roles(a), named2 = [];
  // pronouns: "it" is the last item, "him"/"her" the last person, "them" the last thing, "other" the other one of the
  // last "Which do you mean?". Their ids are used for matching; said: keeps the words typed and adds the name
  // ("play her song" still matches)
  const sub = t => words(t).map(x => { const id = ref(x); if (!id) return x; named2.push(nm(id)); return id; }).join(" ");
  a = sub(a); if (named2.length) said = `${said} ${[...new Set(named2)].join(" ")}`;
  const keep = { ...LINE }, ids = named(a, reach());
  // the two slots: the thing before the role word and the thing after it ("give the bread to the guard"); with no
  // role word, the first and the last thing named ("use key door"), except that a person named first is the second
  // slot ("give the guard the bread"). With nothing before the role word, the thing after it is the direct one
  // ("talk to the guard", "listen to the radio").
  let what = role ? named(sub(role.before), reach())[0] : ids[0], wth = role ? named(sub(role.after), reach())[0] : ids.length > 1 ? ids.at(-1) : null;
  if (!role && wth && own(G.npcs, what) && !own(G.npcs, wth)) [what, wth] = [wth, what];
  const before = role ? words(sub(role.before)).filter(x => !FILLER.includes(x)) : [];
  if (!what && !before.length) [what, wth] = [wth, null];
  if (what === wth) wth = null;
  Object.assign(LINE, { verb: v, said: words(said).join(" "), what: what || null, with: wth || null });
  LINE.it = bySlot(ids).find(id => own(thing(id).on, v)) || ids[0] || null;
  if (S.pick && ids.some(id => !S.pick.ids.includes(id))) S.pick = null;   // naming something else ends "the other one"
  if (ids.pick) S.pick = ids.pick;
  try {
    if (HOOKS.before.some(h => h(v, a, ids))) return;
    if (ids.amb && !NOOBJ.includes(v) && !settle(v, a, said, ids.amb)) return;   // messages.which can read said:
    if (!what && before.length && named(before.join(" "), Object.keys({ ...G.items, ...G.npcs })).length) return notHere();   // "give the bread to him", no bread here
    if (!carry(v)) return;
    if (respond(v, ids)) return;
    LINE.it = bySlot(ids).find(id => own(thing(id).on, v)) || ids[0] || null;
    if (HOOKS.unhandled.some(h => h(v, ids, a))) return;   // nothing in the game answered: add-ons may, before the built-in
    if (own(CMDS, v)) return CMDS[v](a, ids);
    if (a && !ids.length && named(a, Object.keys({ ...G.items, ...G.npcs })).length) return notHere();
    print(a ? txt(own(G.verbs, v)?.fail) || msg("cant") : msg("what"));
  } finally {
    if (v === "examine" && LINE.it) S.seen[LINE.it] = true;
    [LINE.with, LINE.what, LINE.it].forEach(point);   // the thing acted on last, so plain "it" means it

  }
}
// what a pronoun stands for now (an id in reach), or undefined. "other" is the other choice of the last question.
function ref(x) {
  if (x === "other" && S.pick) { const o = S.pick.ids.filter(id => id !== S.pick.id && reach().includes(id)); return o.length === 1 ? o[0] : undefined; }
  const id = PRONOUNS.includes(x) ? S.pro?.[x] : undefined;
  return id && thing(id) ? id : undefined;
}
// remember a thing for the pronouns: an item is "it", a person is npcs.X.pronoun ("her", "him", "them", "it")
// or else both "him" and "her"; anything is "them"
function point(id) {
  if (!id || id === "self" || !thing(id)) return;
  const p = own(G.npcs, id) ? list(G.npcs[id].pronoun || ["him", "her"]) : ["it"];
  for (const x of [...p, "them"]) S.pro[x] = id;
}
// "give the bread to the guard": the words before the first role word and after it, or null.
// A role word inside a name in reach ("the letter to Ana") doesn't split the line.
function roles(t, inside = inNames(words(t))) {
  const w = words(t), i = w.findIndex((x, j) => ROLES.includes(x) && !inside.has(j));
  return i < 0 ? null : { before: w.slice(0, i).join(" "), after: w.slice(i + 1).join(" "), prep: w[i] };
}
// the positions in w that fall inside a name or alias of more than one word, of something in reach
function inNames(w) {
  const pos = new Set();
  for (const id of reach()) for (const p of phrases(id)) { const q = words(p);
    if (q.length > 1) for (let s = 0; s + q.length <= w.length; s++) if (q.every((x, k) => w[s + k] === x)) q.forEach((x, k) => pos.add(s + k)); }
  return pos;
}
// "(first taking the key)": put, and any verb with verbs.X.carry, takes the direct thing first when it's here.
// The take runs as a typed "take" would (before hooks, replies on take, the built-in, which then prints firstTake
// instead of taken), so darkness or a reply can refuse it. Returns false when the thing still isn't carried:
// the command stops there.
let IMPLICIT = false;
function carry(v) {
  const id = LINE.what;
  if (!(v === "put" ? holder(LINE.with) : own(G.verbs, v)?.carry) || !own(G.items, id) || G.items[id].fixed) return true;
  if (S.loc[id] === "player" || !nested(at(G.items)).includes(id) || (LINE.with && nested([id]).includes(LINE.with))) return true;
  IMPLICIT = true;
  try { exec("take", id); } finally { IMPLICIT = false; }
  return S.loc[id] === "player";
}
// a name that fits several things: take wants one that isn't carried, drop and put one that is; if that leaves one,
// use it (true). Otherwise ask "Which do you mean?", keep the command in S.ask, and refund the turn (false).
// A word elsewhere in the line that fits only one of them picks it too ("take the mug, the red one").
function settle(v, a, said, amb) {
  let c = v === "take" ? amb.ids.filter(id => S.loc[id] !== "player") : v === "drop" || v === "put" ? amb.ids.filter(id => S.loc[id] === "player") : amb.ids;
  if (!c.length) c = amb.ids;
  const rest = words(a).filter(x => !words(amb.phrase).includes(x)), by = c.filter(id => rest.some(x => phrases(id).some(p => words(p).includes(x))));
  if (by.length === 1) c = by;
  if (c.length === 1) return S.pick = { ids: amb.ids, id: c[0] }, exec(v, swap(a, amb.phrase, c[0]), swap(words(said).join(" "), amb.phrase, words(nm(c[0])).join(" "))), false;
  S.ask = { v, a, said: words(said).join(" "), phrase: amb.phrase, ids: amb.ids }; S.pick = { ids: amb.ids, id: null };
  EFFECT.free(true); print(msg("which", { list: either(amb.ids) }));
  return false;
}
const swap = (a, phrase, id) => ` ${a} `.replace(` ${phrase} `, ` ${id} `).trim();

// ---- act and parse
const isDir = w => !!own(DIRS, w) || Object.values(DIRS).includes(w);
const known = x => !!own(CMDS, x) || VERBS.has(x) || !!own(ALIAS, x) || isDir(x);
function act(w) {
  if (S.talk) {   // a number picks an option; so do words that fit exactly one option ("offer bread")
    if (/^\d+$/.test(w[0])) { if (!choose(Number(w[0]))) print(msg("choose")); return; }
    const fit = S.talk.opts.map((o, k) => k + 1).filter(k => {
      const t = clean(txt(G.npcs[S.talk.npc].dialogue[S.talk.node].options[S.talk.opts[k - 1]].text));
      return w.every(x => FILLER.includes(x) || t.includes(x)); });
    if (!known(w[0]) && fit.length === 1) { choose(fit[0]); return; }
    S.talk = null; // any other command ends the conversation
  }
  if (S.ask) {   // the answer to "Which do you mean?": words that name one of the choices finish the waiting command
    const q = S.ask, c = named(w.join(" "), q.ids); S.ask = null;
    if (c.length === 1 && !c.amb && !known(w[0])) { S.pick = { ids: q.ids, id: c[0] }; turn(q.v, swap(q.a, q.phrase, c[0]), swap(q.said, q.phrase, words(nm(c[0])).join(" "))); return; }   // said: names the choice
    if (MULTI.includes(q.v) && !known(w[0]) && w.some(x => x === "both" || x === "all")) { turn(q.v, "both", q.said); return; }   // "both": each of the choices
  }
  const two = w.slice(0, 2).join(" "), ph = own(G.phrasal, two) || own(PHRASAL, two);
  if (ph) w = [...words(ph), ...w.slice(2)];
  const inside = inNames(w.slice(1));   // a filler or role word inside a name stays: "take the letter to Ana"
  ROLE = roles(w.slice(1).join(" "), inside);   // before filler words go: "give bread TO guard" keeps its role word
  w = w.filter((x, i) => !FILLER.includes(x) || (i > 0 && inside.has(i - 1)));
  if (!w.length) return print(msg("huh"));
  let [v, ...r] = w; v = own(ALIAS, v) || v;
  if (isDir(v)) { r = [v]; v = "go"; }
  if (v === "go" && r.length === 1) r = [own(DIRS, r[0]) || r[0]];   // "d" is "down", for said: too
  if (v === "look" && ["under", "behind", "beneath", "in", "inside"].includes(r[0]) && (VERBS.has("search") || own(CMDS, "search"))) v = "search";   // "look under the rug"
  if (["menu", "restart", "undo"].includes(v)) return CMDS[v](), "meta";   // no turn, no events
  if (S.over) return print(msg("over"));
  if (!own(CMDS, v) && !VERBS.has(v)) return print(msg("huh"));
  if (v !== "again" && v !== "undo") LAST = w;
  while (v !== "go" && r.length > 1 && PARTICLES.includes(r[0])) r.shift();   // "feel around the wall", "look under the rug"
  while (v !== "go" && r.length && PARTICLES.includes(r.at(-1)) && !(v === "look" && r.length === 1 && own(LEVELS, r[0]))) r.pop();   // "put the hammer down", "feel around"; "look up" stays
  if (ROLE) ROLE.a = r.join(" ");   // exec uses ROLE only for this exact line
  turn(v, r.join(" "), v === "go" ? r.join(" ") : w.slice(1).join(" "));   // said: for go is the direction, spelled out
}
// one command, one turn (unless it's free): "take all" and "take X and Y" run it for each thing, still one turn
function turn(v, a, said) {
  TURN.cost = !isFree(v);
  if (TURN.cost) { UNDO = JSON.stringify(S); S.count.turns++; }   // count before acting so marks stamp this turn
  const each = MULTI.includes(v) && many(v, a);
  if (!each) return exec(v, a, said);
  if (!each.length) {   // nothing to take or drop: free, and add-ons' before hooks may say why (darkness), with no ids
    EFFECT.free(true);
    return HOOKS.before.some(h => h(v, a, [])) || print(msg("nothingAll", { verb: v }));
  }
  each.forEach(id => exec(v, id));
}
// the things "all"/"everything" (less "except X" / "but X"), "both" or "X and Y" stand for, or null for a single thing
function many(v, a) {
  const all = words(a), x = all.findIndex(t => t === "except" || t === "but"), w = x < 0 ? all : all.slice(0, x);
  const not = x < 0 ? [] : named(all.slice(x + 1).join(" "), reach());
  if (w.includes("all") || w.includes("everything"))
    return (v === "take" ? around().filter(id => own(G.items, id) && !G.items[id].fixed && !G.items[id].hidden) : inv()).filter(id => !not.includes(id));
  if (w.includes("both")) {   // "take both mugs", or "both" for the last "Which do you mean?"
    const n = named(w.join(" "), reach()), ids = n.amb ? n.amb.ids : n.length > 1 ? n : (S.pick?.ids || []).filter(id => reach().includes(id));
    return ids.length > 1 ? ids : null;
  }
  const ids = w.includes("and") ? named(a, reach()) : [];
  return ids.length > 1 ? ids : null;
}

function parse(raw) {
  raw = String(raw).slice(0, 200);
  let w = clean(raw);
  if (!w.length && raw.trim() === "?") w = ["help"];
  if (!w.length) return;
  print("> " + raw, "cmd", true);                             // the echo stays literal: "[key]" is not a tag
  TURN.free = TURN.cost = false; ROLLS.clear(); ROLE = null;
  if (w[0] === "oops" && S.talk == null) {   // "oops lamp" after "take lmap": the last line again, with its unknown word replaced
    if (!PREV || w.length < 2) return print(msg("noOops")), save();
    w = oops(PREV, w.slice(1));
  }
  PREV = w;
  for (const h of HOOKS.input) { const r = h(w, raw); if (r === true) return save(); if (Array.isArray(r)) w = r; }
  if (act(w) !== "meta" && !S.talk) { events(); HOOKS.afterTurn.forEach(h => S.over || h()); }
  status(); save();
}

// the first word of a line the game doesn't know (or else its last word), replaced by fix
function oops(line, fix) {
  const V = new Set([...FILLER, ...PARTICLES, ...PRONOUNS, ...BREAK, "all", "everything", "both", "one", "ones", "other", "back", "me", "myself", "self"]);
  for (const id of [...Object.keys(G.items || {}), ...Object.keys(G.npcs || {}), ...(G.self ? ["self"] : [])]) phrases(id).forEach(p => words(p).forEach(x => V.add(x)));
  for (const r in G.rooms) words(G.rooms[r].name).forEach(x => V.add(x));
  for (const n in G.npcs) for (const k in G.npcs[n].topics || {}) words(k.replace(/\|/g, " ")).forEach(x => V.add(x));
  const k = line.findIndex((x, i) => i ? !V.has(x) && !known(x) : !known(x) && !own(G.phrasal, `${x} ${line[1]}`) && !own(PHRASAL, `${x} ${line[1]}`));
  const i = k < 0 ? line.length - 1 : k;
  return [...line.slice(0, i), ...fix, ...line.slice(i + 1)];
}

// the status line above the input: G.status, a TEXT shown after every command (score, health, time...); hidden when empty
function status() { const t = G.status ? txt(G.status) : ""; $("st").hidden = !t; $("st").textContent = t; }

// ---- start, save, add-ons
// the continue slot: a snapshot after every command, kept in the browser too. A finished game can't be continued.
const save = () => { SAVE = S.over ? null : JSON.stringify(S); store("save", SAVE && { ver: VER, s: SAVE }); };

function start() {
  S = blank(); ROLLS.clear();
  for (const T of [G.items, G.npcs]) for (const id in T) S.loc[id] = T[id].at ?? null;
  for (const id in G.items) if (G.items[id].closed) S.shut[id] = true;
  for (const a of ADDONS) if (a.state) S[a.name] = JSON.parse(JSON.stringify(a.state));
  UNDO = LAST = null;
  HOOKS.start.forEach(h => h());
  print(G.title, "title"); print(txt(G.intro)); enter(G.start); S.prev = null; events(); status(); save();
}

// register an add-on: merge its tables (a name already taken is reported), aliases, free verbs and hooks
function addon(a) {
  ADDONS.push(a);
  for (const [T, R] of [[a.commands, CMDS], [a.conditions, COND], [a.effects, EFFECT], [a.messages, MSG], [a.refs, REFS]])
    for (const k in T || {}) { if (k in R) CLASH.push(`addon ${a.name}: "${k}" is already defined`); R[k] = T[k]; }
  Object.assign(ALIAS, a.aliases); Object.assign(PHRASAL, a.phrasal); Object.assign(MAPS, a.maps);
  FREE.push(...(a.free || [])); META.push(...(a.meta || []));
  for (const h in HOOKS) if (a[h]) HOOKS[h].push(a[h]);
}

// ---- validate: check G against the engine's and add-ons' tables; returns a list of "path: problem" lines
function validate() {
  const E = [...CLASH], room = r => !!own(G.rooms, r), isThing = t => !!thing(t);
  const need = (ok, path, m) => ok || E.push(`${path}: ${m}`);
  const used = { flag: {}, mark: {}, counter: {} }, made = { flag: {}, mark: {}, counter: { turns: 1 } };
  // a COND is a name from G.conds, or an object whose keys are all condition keys
  const conds = (c, p) => typeof c === "string" ? need(own(G.conds, c), p, `no condition "${c}" in conds`)
    : c && typeof c === "object" && !Array.isArray(c) && Object.keys(c).forEach(k => need(own(COND, k), `${p}.${k}`, `unknown condition "${k}"`));
  const fx = (e, p) => { if (e && typeof e === "object") for (const k in e) need(own(EFFECT, k) || META.includes(k), `${p}.${k}`, `unknown effect "${k}"`); };
  let seq = 0;
  // mode: "def" (a definition: its keys are fields), "data" (keys are conditions and effects), "map:<child mode>" (keys are names)
  const walk = (v, p, mode) => {
    if (typeof v === "string") return [...v.matchAll(/\[(\w+)\]/g)].forEach(m => need(isThing(m[1]), p, `[${m[1]}] is not an item or NPC`));
    if (!v || typeof v !== "object") return;
    if (v.rotate || v.ladder) SEQ.set(v, "s" + seq++);
    for (const k in v) {
      const x = v[k], q = Array.isArray(v) ? `${p}[${k}]` : p ? `${p}.${k}` : k;
      if (mode.startsWith("map:")) { walk(x, q, mode.slice(4) === "map" ? "map:data" : mode.slice(4)); continue; }
      if (mode === "def") { walk(x, q, own(MAPS, k) ? "map:" + MAPS[k] : k === "self" ? "def" : "data"); continue; }
      // "data" mode: check what each condition or effect key refers to
      {
        if (k === "if" || k === "not") conds(x, q);
        if (k === "any" || k === "all") list(x).forEach((c, i) => conds(c, `${q}[${i}]`));
        if (["has", "give", "take"].includes(k)) list(x).forEach(id => need(own(G.items, id), q, `no item "${id}"`));
        if (k === "here" || k === "seen" || k === "what" || k === "with") list(x).forEach(id => need(isThing(id), q, `no item or NPC "${id}"`));
        if (["in", "goto", "to", "visited"].includes(k)) list(x).forEach(r => need(room(r), q, `no room "${r}"`));
        if (k === "is") list(x).forEach(n => need(own(G.conds, n), q, `no condition "${n}" in conds`));
        if (k === "move") for (const id in x) { need(isThing(id), q, `no item or NPC "${id}"`);
          list(x[id]).forEach(r => need(r === null || r === "player" || room(r) || holder(r), q, `no room or holder "${r}"`)); }
        if (k === "level" && x && typeof x === "object") for (const id in x) { need(isThing(id), q, `no item or NPC "${id}"`);
          need(x[id] === null || x[id] === "up" || x[id] === "down", q, `"${x[id]}": a level is "up", "down" (or null, in an effect)`); }
        if (k === "inside") typeof x === "object" && x ? Object.keys(x).forEach(id => need(own(G.items, id) && holder(x[id]), q, `"${id}" in "${x[id]}": needs an item and a holder`))
          : need(false, q, 'inside takes { item: "holder" }');
        if (["open", "close"].includes(k) && typeof x !== "object") list(x).forEach(id => need(own(G.items, id) && "closed" in G.items[id], q, `"${id}" can't open or close (give it closed:true or false)`));
        if (k === "flag") list(x).forEach(f => used.flag[f] = q);
        if (k === "set" || k === "unset") list(x).forEach(f => made.flag[f] = 1);
        if (k === "mark") list(x).forEach(m => made.mark[m] = 1);
        if (k === "since") for (const m in x) used.mark[m] = q;
        if (k === "add") for (const c in x) made.counter[c] = 1;
        if (["min", "max", "eq", "add", "prop"].includes(k) && x && typeof x === "object") for (const c in x) {   // "guard.hp": a thing's prop
          const [id, p] = propKey(c);
          if (id !== null) need(isThing(id) || id === "self", q, `"${c}": no item or NPC "${id}"`);
          if (["min", "max", "eq"].includes(k) && (id === null || own(thing(id)?.props, p) === undefined)) used.counter[c] = q;   // a data value counts as set
          if (k === "prop") made.counter[c] = 1; }
        if (own(REFS, k)) REFS[k](x, (ok, m) => need(ok, q, m));
      }
      if (!["add", "min", "max", "eq", "since", "move", "level", "prop"].includes(k)) walk(x, q, "data");   // their keys are names
    }
  };
  need(room(G.start), "start", `no room "${G.start}"`);
  for (const r in G.rooms) for (const d in G.rooms[r].exits || {}) need(room(dest(G.rooms[r].exits[d])), `rooms.${r}.exits.${d}`, `no room "${dest(G.rooms[r].exits[d])}"`);
  for (const T of ["items", "npcs"]) for (const id in G[T]) { const a = G[T][id].at;
    need(a == null || a === "player" || room(a) || (T === "items" && holder(a)), `${T}.${id}.at`, `no room or holder "${a}"`);
    const n = G[T][id].name; need(typeof n === "string" || (n && typeof n === "object"), `${T}.${id}.name`, "needs a name (a string, or TEXT variants)"); }
  for (const id in G.items) need(!own(G.npcs, id), `items.${id}`, "same id as an NPC");
  for (const [T, id] of [...["items", "npcs"].flatMap(T => Object.keys(G[T] || {}).map(id => [T, id])), ["self", null]]) {   // props hold numbers and words
    const P = (id ? G[T][id] : G.self)?.props;
    for (const k in P || {}) need(typeof P[k] === "number" || typeof P[k] === "string", `${id ? `${T}.${id}` : T}.props.${k}`, "a prop is a number or a word"); }
  const levels = v => typeof v === "string" ? [v] : list(v).flatMap(x => typeof x === "string" ? [x] : x?.text != null ? levels(x.text) : []);
  for (const T of ["items", "npcs"]) for (const id in G[T]) levels(G[T][id].level ?? []).forEach(l => need(l === "up" || l === "down", `${T}.${id}.level`, `"${l}": a level is "up" or "down"`));
  for (const id in G.items) { const h = G.items[id].holds; need(h == null || h === "in" || h === "on", `items.${id}.holds`, 'must be "in" or "on"'); }
  for (const id in G.items) { let p = G.items[id].at, n = 0; while (holder(p) && n++ < 50) p = G.items[p].at;   // at: chains must end in a room
    need(n < 50, `items.${id}.at`, "holders hold each other in a loop");
    need(!holder(id) || !room(id), `items.${id}`, "a holder can't share its id with a room"); }
  for (const n in G.npcs) { const D = G.npcs[n].dialogue; if (!D) continue;
    need(D.start, `npcs.${n}.dialogue`, `no "start" node`);
    for (const id in D) (D[id].options || []).forEach((o, i) => { const p = `npcs.${n}.dialogue.${id}.options[${i}]`;
      need(!o.next || o.next in D, `${p}.next`, `no node "${o.next}"`); fx(o, p); }); }
  // replies and events: every key must be an effect (catches typos like "sey")
  const replies = (on, p) => { for (const v in on || {}) list(on[v]).forEach((e, i) => fx(e, `${p}.${v}[${i}]`)); };
  for (const T of ["rooms", "items", "npcs"]) for (const id in G[T]) replies(G[T][id].on, `${T}.${id}.on`);
  for (const id in G.npcs) replies(G.npcs[id].topics, `npcs.${id}.topics`);
  replies(G.on, "on"); replies(G.self?.on, "self.on");
  for (const k in G.kinds || {}) replies(G.kinds[k], `kinds.${k}`);
  (G.events || []).forEach((e, i) => fx(e, `events[${i}]`));
  for (const c in G.conds || {}) conds(G.conds[c], `conds.${c}`);
  for (const k in G.messages || {}) need(k in MSG, `messages.${k}`, `no engine message "${k}"`);
  for (const v in G.verbs || {}) for (const w of G.verbs[v].aliases || [])   // an alias may not take over a command, a built-in alias or another verb
    need((!own(ALIAS, w) || ALIAS[w] === v) && !own(CMDS, w) && (w === v || !VERBS.has(w)) && !isDir(w), `verbs.${v}.aliases`, `"${w}" is already a command or alias`);
  // an alias or phrasal verb must lead to a command the game understands (a built-in, an add-on's, or a verb with replies)
  const known = c => !!own(CMDS, c) || VERBS.has(c) || isDir(c);
  for (const T of ["aliases", "phrasal"]) for (const w in G[T] || {}) need(known(words(G[T][w])[0]), `${T}.${w}`, `no command "${G[T][w]}"`);
  walk(G, "", "def");
  for (const t in used) for (const k in used[t]) need(made[t][k], used[t][k], `${t} "${k}" is checked but never set`);
  HOOKS.validate.forEach(h => h(need));
  return E;
}

// ---- menu and boot
function menu() { document.body.classList.remove("playing"); $("bs").hidden = false; $("bc").hidden = !SAVE; $("ask").hidden = true; }

// fresh: a new game. Otherwise Continue: the snapshot, over a blank state so a key it lacks (an older save) has its default
function play(fresh) {
  document.body.classList.add("playing"); out.innerHTML = "";
  if (fresh) start(); else { S = Object.assign(blank(), JSON.parse(SAVE), { talk: null });
    for (const a of ADDONS) if (a.state && !own(S, a.name)) S[a.name] = JSON.parse(JSON.stringify(a.state));   // an add-on added since the save
    UNDO = LAST = null; exec("look"); status(); }
  inp.focus();
}

// boot runs after every script (including add-ons) has loaded
document.addEventListener("DOMContentLoaded", () => {
  // every verb named in a reply map or G.verbs is a command; G.aliases and verbs.X.aliases are more words for one
  const ons = [G, G.self, ...Object.values(G.rooms), ...Object.values(G.items || {}), ...Object.values(G.npcs || {})].map(o => o?.on);
  for (const o of [...ons, ...Object.values(G.kinds || {}), G.verbs]) for (const v in o || {}) VERBS.add(v);
  for (const v in G.verbs || {}) for (const w of G.verbs[v].aliases || []) if (!own(ALIAS, w)) ALIAS[w] = v;
  for (const w in G.aliases || {}) ALIAS[w] = G.aliases[w];
  // the save version: a save made with other rooms, items, NPCs, events or G.version won't Continue.
  // Text and flag changes keep saves; bump G.version when a content patch should end runs in progress.
  VER = [G.version ?? "", Object.keys(G.rooms), Object.keys(G.items || {}), Object.keys(G.npcs || {}), (G.events || []).length].join("|");
  inp.maxLength = 200; PREF = load("prefs") || {};
  $("f").onsubmit = e => { e.preventDefault(); parse(inp.value); inp.value = ""; };
  $("bs").onclick = () => SAVE ? ($("bs").hidden = $("bc").hidden = true, $("ask").hidden = false, $("bn").focus()) : play(true);
  $("by").onclick = () => play(true);
  $("bn").onclick = menu;
  $("bc").onclick = () => play(false);
  $("mt").textContent = document.title = G.title;
  const problems = validate();
  if (problems.length) { $("err").hidden = false; $("err").textContent = `Game data problems (${problems.length}):\n` + problems.join("\n"); console.error(problems); }
  const d = load("save");   // a save from another version of the game (different rooms, items or events) is ignored
  if (d?.ver === VER && typeof d.s === "string") try { const s = JSON.parse(d.s); if (own(G.rooms, s.room) && s.loc && s.count && !s.over) SAVE = d.s; } catch {}
  HOOKS.boot.forEach(h => h());
  menu();
});
</script>

<script>
/* ---- ADD-ON: light & darkness --------------------------------------------
   Data:  rooms.X.dark:  true, or a COND (dark only while it passes)
          items.X.light: true, or a COND (gives light only while it passes)
                         e.g. light:{ flag:"lamp_lit" } with a "use" that sets it
   In the dark (dark room, no light source carried or in the room) the player
   can only reach what they carry (the reach hook), so no verb finds anything
   else. Looking, or a hands-on command that finds nothing (take, take all,
   open, examine, use, put, talk, give, show, or any verb a thing has a reply
   for, and "talk" alone), says it's dark instead of "You don't see that here."
   With light, the
   usual messages. Speaking, moving and dropping what you carry are untouched.
   Condition: dark:true / dark:false - is the player in darkness right now?
   Messages (reword in G.messages): dark, darkFalls.
   ------------------------------------------------------------------------- */
{
  const holds = v => v === true || (!!v && typeof v === "object" && test(v));
  // verbs that need to see what they touch: the built-ins, and any verb a thing or a kind has a reply for
  const HANDS = ["take", "put", "open", "close", "examine", "use", "talk", "give", "show"];
  const hands = v => HANDS.includes(v) || [...Object.values(G.items), ...Object.values(G.npcs)].some(t => own(t.on, v)) || Object.values(G.kinds || {}).some(k => own(k, v));
  const inDark = () => holds(G.rooms[S.room].dark) && ![...inv(), ...at(G.items)].some(id => holds(G.items[id].light));
  addon({
    name: "light",
    state: { room: null, dark: false },
    messages: { dark: "It's pitch dark. You can't see a thing.", darkFalls: "Everything goes dark." },
    conditions: { dark: v => inDark() === v },
    reach: ids => inDark() ? ids.filter(id => id === "self" || where(id) === "player") : ids,   // only what you carry
    before(v, a, ids) {   // look, or a hands-on command that found nothing it can reach: it's the dark's fault
      if (inDark() && (v === "look" || (v === "talk" && !a) || (a && !ids.length && v !== "drop" && (hands(v) || named(a, [...nested(at(G.items)), ...at(G.npcs)]).length))))
        return print(msg("dark")), true;
    },
    afterTurn() {   // light appears or vanishes while you stand still: reveal or hide the room
      const d = inDark(), L = S.light;
      if (L.room === S.room && L.dark !== d) d ? print(msg("darkFalls")) : exec("look");
      L.room = S.room; L.dark = d;
    },
    validate(need) {
      const any = Object.values(G.items).some(i => i.light);
      for (const r in G.rooms) need(!G.rooms[r].dark || any, `rooms.${r}.dark`, 'dark room, but no item has "light"');
    }
  });
}
</script>
