<script>
/* =====================================================================
   ENGINE — reuse as-is. Conditions, effects and commands live in the COND,
   EFFECT and CMDS tables, which add-ons extend (see ADD-ONS below).
   On load, validate() checks the game data and lists any problems on the
   start menu (and in the browser console) with the exact path.
   ===================================================================== */
const $ = id => document.getElementById(id), out = $("out"), inp = $("in");
const DIRS = { n: "north", s: "south", e: "east", w: "west", u: "up", d: "down" };
const ALIAS = { z: "wait", l: "look", i: "inventory", inv: "inventory", x: "examine", get: "take", grab: "take",
  walk: "go", move: "go", speak: "talk", h: "help", "?": "help" };
const FILLER = ["a", "an", "the", "to", "at", "with", "on"];
const FREE = ["help", "menu"];                    // commands that don't cost a turn
const ADDONS = [], HOOKS = { before: [], afterTurn: [], validate: [] }, CLASH = [];
let S, SAVE = null;   // SAVE = the continue slot: a text snapshot of S (a plug-in can persist it)

function print(t, c) {
  const p = document.createElement("p"); if (c) p.className = c;
  t.split(/\[(\w+)\]/).forEach((s, i) => {          // odd parts are ids from [id]
    const o = i % 2 && (G.npcs[s] || G.items[s]);
    if (!o) return p.append(i % 2 ? `[${s}]` : s);   // unknown id stays visible for the author
    const sp = document.createElement("span");
    sp.className = G.npcs[s] ? "npc" : "item"; sp.textContent = o.name; p.append(sp);
  });
  out.append(p); out.scrollTop = out.scrollHeight;
}
const names = ids => ids.map(i => `[${i}]`).join(", ");
const at = (T, place = S.room) => Object.keys(T).filter(id => S.loc[id] === place);
const inv = () => at(G.items, "player");
const all = (o, f) => Object.entries(o || {}).every(([k, n]) => f(S.count[k] || 0, n, k));
const find = (w, ids, T) => ids.find(id => { const n = T[id].name.toLowerCase();
  return id === w || n === w || n.split(" ").includes(w) || (T[id].aliases || []).includes(w); });
const txt = v => [].concat(v).map(x => typeof x === "string" ? { text: x } : x).find(x => test(x.if))?.text
  .replace(/\{(\w+)\}/g, (_, k) => S.count[k] || 0) || "";   // {counter} shows its value

// ---- conditions: every key in an "if" must pass
const COND = {
  has: v => S.loc[v] === "player",
  here: v => S.loc[v] === S.room,
  in: v => S.room === v,
  flag: v => !!S.flags[v],
  not: v => !test(v),
  min: o => all(o, (v, n) => v >= n),
  max: o => all(o, (v, n) => v <= n),
  since: o => all(o, (v, n, k) => k in S.mark && S.count.turns - S.mark[k] >= n)
};
const test = (c = {}) => Object.keys(c).every(k => !COND[k] || COND[k](c[k]));

// ---- effects: run in table order; say, goto and end always run last
const EFFECT = {
  set: v => S.flags[v] = true,
  unset: v => delete S.flags[v],
  add: o => { for (const k in o) S.count[k] = (S.count[k] || 0) + o[k]; },
  mark: v => S.mark[v] = S.count.turns,
  move: o => { for (const id in o) { const r = o[id];   // a list is a route: step to the next room
    S.loc[id] = Array.isArray(r) ? r[(r.indexOf(S.loc[id]) + 1) % r.length] : r; } },
  take: v => { S.loc[v] = null; print(`(Lost: [${v}])`, "cmd"); },
  give: v => { S.loc[v] = "player"; print(`(Received: [${v}])`, "cmd"); },
  say: v => { const t = txt(v); if (t) print(t); },
  goto: v => enter(v),
  end: v => { print(txt(v), "title"); S.over = true; }
};
const LAST = ["say", "goto", "end"];
function run(e = {}) {
  for (const k of [...Object.keys(EFFECT).filter(k => !LAST.includes(k)), ...LAST]) if (k in e) EFFECT[k](e[k]);
}

function events() {
  (G.events || []).forEach((e, i) => { if (!S.over && (e.repeat || !S.fired[i]) && test(e.if)) { S.fired[i] = true; run(e); } });
}

function look() {
  const r = G.rooms[S.room], d = txt(r.desc), extra = T => at(T).filter(id => !d.includes(`[${id}]`));
  const it = extra(G.items), np = extra(G.npcs), ex = Object.keys(r.exits || {});
  print(r.name, "title"); print(d);
  if (it.length) print("You see: " + names(it));
  if (np.length) print("Here: " + names(np));
  if (ex.length) print("Exits: " + ex.join(", "));
}

function enter(id) { S.room = id; exec("look"); }

function go(d) {
  d = DIRS[d] || d;
  const x = (G.rooms[S.room].exits || {})[d];
  if (!x) return print("You can't go that way.");
  const e = typeof x === "string" ? { to: x } : x;
  test(e.if) ? enter(e.to) : print(txt(e.fail || "Something blocks the way."));
}

function node(npc, id) {
  const n = G.npcs[npc].dialogue[id], opts = (n.options || []).filter(o => test(o.if));
  print(`[${npc}]: "${txt(n.text)}"`);
  S.talk = opts.length ? { npc, opts } : null;
  opts.forEach((o, i) => print(`${i + 1}. ${o.text}`, "cmd"));
}

// ---- commands: each gets the rest of the typed line (filler words removed)
const CMDS = {
  look,
  go,
  take(a) {
    const id = find(a, at(G.items), G.items);
    if (!id) return print("You don't see that here.");
    if (G.items[id].fixed) return print("You can't take that.");
    S.loc[id] = "player"; print(`Taken: [${id}]`);
  },
  drop(a) {
    const id = find(a, inv(), G.items);
    if (!id) return print("You don't have that.");
    S.loc[id] = S.room; print(`Dropped: [${id}]`);
  },
  inventory() { const i = inv(); print(i.length ? "You carry: " + names(i) : "You carry nothing."); },
  examine(a) {
    if (!a) return exec("look");
    const id = find(a, [...inv(), ...at(G.items)], G.items), n = find(a, at(G.npcs), G.npcs);
    print(id ? txt(G.items[id].desc) : n ? txt(G.npcs[n].desc) : "You don't see that.");
  },
  use(a) {
    const id = find(a, inv(), G.items);
    if (!id) return print("You don't have that.");
    const u = (G.items[id].use || []).find(u => test(u.if));
    u ? run(u) : print("Nothing happens.");
  },
  talk(a) {
    const l = at(G.npcs), n = a ? find(a, l, G.npcs) : l[0];
    if (!n) return print("No one by that name is here.");
    G.npcs[n].dialogue ? node(n, "start") : print(`[${n}] doesn't respond.`);
  },
  wait() { print("Time passes."); },
  help() { print("Commands: " + Object.keys(CMDS).join(", ") + ". Directions: n, s, e, w, u, d."); },
  menu
};

// a command runs unless a "before" hook handles it first
const exec = (v, a = "") => HOOKS.before.some(h => h(v, a)) || CMDS[v](a);

function act(w) {
  if (S.talk) {
    if (/^\d+$/.test(w[0])) {
      const o = S.talk.opts[w[0] - 1], npc = S.talk.npc;
      if (!o) return print("Choose a number from the list.");
      S.talk = null; run(o); if (o.next && !S.over) node(npc, o.next); return;
    }
    S.talk = null; // any other command ends the conversation
  }
  let [v, ...r] = w; v = ALIAS[v] || v;
  if (DIRS[v] || Object.values(DIRS).includes(v)) { r = [v]; v = "go"; }
  if (S.over && v !== "menu") return print("The game is over. Type 'menu' to return to the start menu.");
  if (!CMDS[v]) return print("I don't understand that. Type 'help'.");
  if (!FREE.includes(v)) S.count.turns++;   // count before acting so marks stamp this turn
  exec(v, r.join(" "));
}

function parse(raw) {
  const w = raw.toLowerCase().trim().split(/\s+/).filter(x => x && !FILLER.includes(x));
  if (!w.length) return;
  print("> " + raw, "cmd");
  act(w);
  if (!S.talk) { events(); HOOKS.afterTurn.forEach(h => S.over || h()); }
  save();
}

const save = () => SAVE = S.over ? null : JSON.stringify(S);   // finished games can't be continued

function start() {
  S = { room: G.start, loc: {}, flags: {}, count: { turns: 0 }, mark: {}, fired: {}, talk: null, over: false };
  for (const T of [G.items, G.npcs]) for (const id in T) S.loc[id] = T[id].at ?? null;
  for (const a of ADDONS) if (a.state) S[a.name] = JSON.parse(JSON.stringify(a.state));
  print(G.title, "title"); print(txt(G.intro)); enter(G.start); events(); save();
}

function addon(a) {
  ADDONS.push(a);
  for (const [T, R] of [[a.commands, CMDS], [a.conditions, COND], [a.effects, EFFECT]])
    for (const k in T || {}) { if (k in R) CLASH.push(`addon ${a.name}: "${k}" is already defined`); R[k] = T[k]; }
  Object.assign(ALIAS, a.aliases); FREE.push(...(a.free || []));
  for (const h in HOOKS) if (a[h]) HOOKS[h].push(a[h]);
}

function validate() {
  const E = [...CLASH], room = r => r in G.rooms, thing = t => t in G.items || t in G.npcs;
  const need = (ok, path, msg) => ok || E.push(`${path}: ${msg}`);
  const used = { flag: {}, mark: {}, counter: {} }, made = { flag: {}, mark: {}, counter: { turns: 1 } };
  const walk = (v, p) => {
    if (typeof v === "string") return [...v.matchAll(/\[(\w+)\]/g)].forEach(m => need(thing(m[1]), p, `[${m[1]}] is not an item or NPC`));
    if (!v || typeof v !== "object") return;
    for (const k in v) {
      const x = v[k], q = Array.isArray(v) ? `${p}[${k}]` : p ? `${p}.${k}` : k;
      if (k === "if" || k === "not") for (const c in x) need(c in COND, `${q}.${c}`, `unknown condition "${c}"`);
      if (["has", "give", "take"].includes(k)) need(x in G.items, q, `no item "${x}"`);
      if (k === "here") need(thing(x), q, `no item or NPC "${x}"`);
      if (["in", "goto", "to"].includes(k)) need(room(x), q, `no room "${x}"`);
      if (k === "move") for (const id in x) { need(thing(id), q, `no item or NPC "${id}"`);
        [].concat(x[id]).forEach(r => need(r === null || r === "player" || room(r), q, `no room "${r}"`)); }
      if (k === "flag") used.flag[x] = q;
      if (k === "set" || k === "unset") made.flag[x] = 1;
      if (k === "mark") made.mark[x] = 1;
      if (k === "since") for (const m in x) used.mark[m] = q;
      if (k === "add") for (const c in x) made.counter[c] = 1;
      if (k === "min" || k === "max") for (const c in x) used.counter[c] = q;
      walk(x, q);
    }
  };
  need(room(G.start), "start", `no room "${G.start}"`);
  for (const r in G.rooms) for (const d in G.rooms[r].exits || {}) { const x = G.rooms[r].exits[d];
    if (typeof x === "string") need(room(x), `rooms.${r}.exits.${d}`, `no room "${x}"`); }
  for (const T of ["items", "npcs"]) for (const id in G[T]) { const a = G[T][id].at;
    need(a == null || a === "player" || room(a), `${T}.${id}.at`, `no room "${a}"`); }
  for (const id in G.items) need(!(id in G.npcs), `items.${id}`, "same id as an NPC");
  for (const n in G.npcs) { const D = G.npcs[n].dialogue; if (!D) continue;
    need(D.start, `npcs.${n}.dialogue`, `no "start" node`);
    for (const id in D) (D[id].options || []).forEach((o, i) =>
      need(!o.next || o.next in D, `npcs.${n}.dialogue.${id}.options[${i}].next`, `no node "${o.next}"`)); }
  walk(G, "");
  for (const t in used) for (const k in used[t]) need(made[t][k], used[t][k], `${t} "${k}" is checked but never set`);
  HOOKS.validate.forEach(h => h(need));
  return E;
}

function menu() { document.body.classList.remove("playing"); $("bs").hidden = false; $("bc").hidden = !SAVE; $("ask").hidden = true; }

function play(fresh) {
  document.body.classList.add("playing"); out.innerHTML = "";
  if (fresh) start(); else { S = JSON.parse(SAVE); S.talk = null; exec("look"); }
  inp.focus();
}

// boot runs after every script (including add-ons) has loaded
document.addEventListener("DOMContentLoaded", () => {
  $("f").onsubmit = e => { e.preventDefault(); parse(inp.value); inp.value = ""; };
  $("bs").onclick = () => SAVE ? ($("bs").hidden = $("bc").hidden = true, $("ask").hidden = false, $("bn").focus()) : play(true);
  $("by").onclick = () => play(true);
  $("bn").onclick = menu;
  $("bc").onclick = () => play(false);
  $("mt").textContent = document.title = G.title;
  const problems = validate();
  if (problems.length) { $("err").hidden = false; $("err").textContent = `Game data problems (${problems.length}):\n` + problems.join("\n"); console.error(problems); }
  menu();
});
</script>

<script>
/* ---- ADD-ON: restart ("restart" starts a new game, even after an ending) ----
   No data. The engine only accepts "menu" once a game is over, so this wraps
   the engine's act() to catch "restart" first.
   ------------------------------------------------------------------------- */
{
  const act0 = act;
  act = w => w[0] === "restart" ? play(true) : act0(w);
  addon({ name: "restart" });
}
</script>

<script>
/* ---- ADD-ON: verbs (room and global replies for any verb; what was typed as a condition)
   Data:  rooms.X.on / on: { verb: REPLY }   REPLY = a string, or a list of { if:COND, ...EFFECT }
            (a string entry = { say }). The current room's reply is tried first, then the global
            one (G.on); the first entry whose "if" passes runs.
            A verb the engine doesn't know becomes a command; with no passing entry it prints
            G.fallback (default "You can't do that here.") and still costs a turn.
            For a core verb (take, use, go...), a passing entry runs instead of the core command.
            Capitalize a verb that is also an effect key (Take, Say, Give), or the engine's
            validator reads it as that effect; case doesn't matter otherwise.
          aliases: { word: "command" }   more words for a command ("quit": "menu"); a word that
            is also an effect key is capitalized too ("Give": "use")
          rooms.X.ways: { word: "direction" }   "go <word>" / "climb <word>" here means that
            direction ("stairs": "up"). Aliases that name a direction work after go too.
          free:    ["verb", ...]         commands that don't cost a turn
   Condition: said:"phrase"   the words typed after the verb contain the phrase, whole words only.
                "a|b" = either one; a list = every one of them; "" = nothing was typed. Hyphens count as spaces, and
                for go a direction is spelled out ("d" is "down").
              any:[COND, ...]  at least one of them passes
              only:"a|b c"  every word typed after the verb is one of these words (or nothing was typed)
   "look <thing>" examines it ("look around" still looks); "look under/behind/in <thing>"
   searches it; "pick up <thing>" takes it; "drop X in Y" uses X on Y; "climb <stairs word or direction>" walks. The echo of what the
   player typed never turns [id] into a name.
   Input: punctuation is dropped from typed words (letters, digits, hyphens and
          apostrophes stay), so "say giraffe!" and "north." work. List this add-on
          before any add-on that wraps act() (restart), so they see clean words too.
          bare: { word: TEXT }   the word typed alone prints TEXT, free ("show": "Show what, to whom?")
          phrasal: { "two words": "command" }   a two-word verb, filler words included ("scream at": "provoke")
          oneAtATime: TEXT, spoken: ["say", ...]   "X and Y" does X, then prints oneAtATime (not for
            the spoken verbs, where "and" is part of what's said)
   Order: its replies answer before any add-on listed after it (nouns) gets a turn.
   Effect: line:[part, ...]   prints the parts joined together. A part is TEXT, or
             { list:[TEXT, ...], none:TEXT }: the non-empty ones joined with ", ", or none.
   ------------------------------------------------------------------------- */
{
  let said = "";
  const norm = s => ` ${s.toLowerCase().replace(/-/g, " ").replace(/\s+/g, " ").trim()} `;
  const reply = r => { const e = [].concat(r || []).map(x => typeof x === "string" ? { say: x } : x).find(x => test(x.if));
    if (e) run(e); return !!e; };
  const on = o => Object.fromEntries(Object.entries(o.on || {}).map(([v, r]) => [v.toLowerCase(), r]));
  const ON = new Map([G, ...Object.values(G.rooms)].map(o => [o, on(o)]));
  const answer = (v, a) => { said = norm(v === "go" ? DIRS[a] || a : a);
    const ok = reply(ON.get(G.rooms[S.room])[v]) || reply(ON.get(G)[v]); said = ""; return ok; };
  const verbs = new Set([...ON.values()].flatMap(Object.keys));
  const commands = {};
  for (const v of verbs) if (!CMDS[v]) commands[v] = () => print(txt(G.fallback || "You can't do that here."));   // before() answers first
  const BARE = Object.fromEntries(Object.entries(G.bare || {}).map(([w, t]) => [w.toLowerCase(), t]));
  let two = null;   // a two-word verb, read from the raw line before the engine drops "at" and "to"
  const parse0 = parse;
  parse = raw => { const k = raw.toLowerCase().replace(/[^\p{L}\p{N}' -]+/gu, " ").trim().split(/\s+/).slice(0, 2).join(" ");
    two = G.phrasal?.[k] ? k : null; parse0(raw); two = null; };
  const act0 = act;   // clean the words; the echo line still shows what was typed
  act = w => {
    w = w.map(x => x.replace(/[^\p{L}\p{N}'-]+/gu, " ")).join(" ").split(" ").filter(x => x && !FILLER.includes(x));
    if (two) { w = [G.phrasal[two], ...w.slice(two.split(" ").filter(x => !FILLER.includes(x)).length)]; two = null; }
    if (w.length === 1 && BARE[w[0]]) return print(txt(BARE[w[0]]));   // no command runs, so no turn
    const and = w.indexOf("and"), v = ALIAS[w[0]] || w[0];
    // "open the giraffe gate and the jaguar gate": the first one, then a nudge (not for words said out loud)
    if (G.oneAtATime && and > 1 && and < w.length - 1 && !(G.spoken || []).includes(v)) { act0(w.slice(0, and)); return print(txt(G.oneAtATime)); }
    act0(w);
  };
  const plain = print;   // the echo stays literal: "[coin]" must not print the item's name
  print = (t, c) => plain(c === "cmd" && t.startsWith("> ") ? t.replace(/\[/g, "[\u200b") : t, c);
  const ALIASES = Object.fromEntries(Object.entries(G.aliases || {}).map(([w, c]) => [w.toLowerCase(), c]));
  const isDir = d => d in DIRS || Object.values(DIRS).includes(d);
  const part = p => p?.list ? p.list.map(txt).filter(Boolean).join(", ") || txt(p.none || "") : txt(p);
  addon({
    name: "verbs",
    commands, aliases: ALIASES, free: G.free,
    conditions: {
      said: p => [].concat(p).every(q => q === "" ? !said.trim() : q.split("|").some(w => said.includes(norm(w)))),
      any: l => l.some(c => test(c)),
      only: p => said.trim().split(" ").every(w => !w || p.split("|").some(x => norm(x).trim().split(" ").includes(w)))
    },
    effects: { line: v => print(v.map(part).join("")) },
    before(v, a) {
      const [w0, ...rest] = a.split(" ");
      if (v === "look" && ["under", "behind", "in", "inside", "beneath"].includes(w0) && rest.length) return exec("search", rest.join(" ")), true;
      if (v === "look" && a && !["around", "room", "here"].includes(a)) return exec("examine", a), true;
      if (v === "take" && w0 === "up" && rest.length) return exec("take", rest.join(" ")), true;   // "pick up the grapes"
      const into = a.split(" ").findIndex(w => w === "in" || w === "into");
      if (v === "drop" && into > 0) return exec("use", a.split(" ").filter((w, i) => i !== into).join(" ")), true;   // "drop coin in hippo" = use it on
      const way = (v === "go" || v === "climb") && (G.rooms[S.room].ways?.[a] || ALIAS[a] || (v === "climb" && isDir(a) && a));
      if (way && (way !== a || v === "climb") && isDir(way)) return exec("go", way), true;   // "go upstairs", "climb stairs"
      if (verbs.has(v) && answer(v, a)) return true;
    },
    validate(need) {
      for (const v of verbs) need(!(v in COND), `on.${v}`, "verb name is also a condition key");
      for (const w in ALIASES) need(w !== ALIASES[w], `aliases.${w}`, "alias points at itself");
      for (const r in G.rooms) for (const w in G.rooms[r].ways || {}) need(isDir(G.rooms[r].ways[w]), `rooms.${r}.ways.${w}`, "not a direction");
    }
  });
}
</script>

<script>
/* ---- ADD-ON: nouns (scenery you can examine and handle; text that follows state)
   Data:  keys: { NAME: COND }   named states. A key string is NAME, !NAME, or several
            joined by "&" ("ESCAPE&!P1"); null always passes. Usable in any "if" as key:"...".
          LINES = [[key, text, obj?, "free"?], ...]   the LAST line whose key passes wins.
            obj: the line needs these words typed too ("coins", "a|b"). "free": costs no turn.
          Verb names are read in any case: write "Take" (an effect key) so the engine's
          validator doesn't read it as the take effect.
          nouns: { id: { at: room | "any", cat, words:[...], strike?:"NAME", puzzle?:"KEY",
                         examine: LINES, <verb>: LINES } }
            A noun can be seen only while one of its examine lines passes.
          items.X / npcs.X: cat, strike, puzzle (same meaning, for things the engine owns)
          categories: { CAT: { verb: LINES } }   "*" = any verb; key "SOLVED" = the noun's puzzle key
          anywhere: { verb: LINES }   any noun or none, when nothing more specific fits
          alone:    { verb: LINES }   the verb typed with no noun (after the room's own line)
          rooms.X.verbs: { verb: LINES }   the verb with no noun, in that room
          rooms.X.words: [...], rooms.X.again: LINES   "examine <room next door>" prints
            "Through the doorway: " + its REVISIT (TOUR) or again (ESCAPE) text
          throughDoor: roomId => TEXT   what "examine <room next door>" shows (else its revisit or escape-revisit line)
          groups: { verb: ["other", ...] }   more keys to try for a verb ("push": ["handle"])
          strike: EFFECT, strikeVerbs: [...], strikeWith: [...]   during keys.TOUR, a strike verb
            (noting STRIKE3_BY = the thing's strike name, STRUCK = its id)
            on a thing with "strike" runs the strike effect (strikeWith verbs: when a strike
            thing is named anywhere in the line, "use coin on hippo")
          tourFree: true   commands this add-on answers cost no turn while keys.TOUR passes
          tails: { room: [{ key, text, group?, once?, top? }, ...] }   ESCAPE: extra lines after
            the room's description (one per group; once: once a game; top: printed first).
            They wait for the end of the turn, then the band line: at most G.extras lines,
            counting any of G.npcLines printed that turn. No band line on a turn where one of
            G.warnings prints; no turn feedback then either.
          bands: { rooms: { room: TYPE }, lines: { KEY: { TYPE: [TEXT, TEXT] } } }   one line after the
            tails, from the first passing KEY; each cell alternates its two lines
          feedback: [TEXT, ...]   ESCAPE: after a turn-costing reply that changed nothing (a
            category or anywhere line, "Nothing happens.", G.nowhere, or an effect with
            feedback:true), the next line, in turn
          reactions: { id: TEXT }, reactIf: COND   printed after the FIRST look at id while reactIf passes
          caught: { if: COND, by: (verb, words) => value }   while "if" passes, a command that costs a
            turn and no earlier add-on answered does nothing but note CAUGHT_BY = by(...)
          "say <words>" with no reply of its own: a topic if the words name one, else "talk <npc>",
          for the NPC whose topics' "when" passes.
          topics: { npc: { when: COND, list: [{ words:[...], lines: LINES }], other: LINES,
                           coldKey, cold: [TEXT, ...] } }   "ask/tell <npc> about <topic>"
          lookCloser: { prefix: TEXT, room: roomId => [TEXT, ...] }   "examine X" that finds nothing: the first
            sentence naming X in the room's text (room(id)), in this room's things' examine, smell and
            listen lines and descriptions, or in anything printed since you walked in (not the engine's
            own lines in messages), printed after prefix. Only then "not here".
          firstLook: { id: TEXT }   replaces the examine text the first time id is examined
          report: { lines: [[part, ...], ...], after: TEXT, counted: [ids] }   printed inside every
            ending's text block, after it: a part is TEXT or { list:[TEXT, ...], none:TEXT }; a
            line that comes out empty is skipped. {examined} / {examinable} count the first looks
            at nouns and the counted ids, out of all of them; report.bonus ids count apart, as
            {bonus} / {bonuses}.
          "talk <noun>": the noun's talk line, then its category's (NPCs keep the engine's talk).
   Effects: rotate:[TEXT, ...] prints the next line of that list, in turn.
            ladder:[TEXT, ...] prints the next line, then stays on the last (hint ladders).
            note:{ name: value } remembers a value; condition noted:{ name: value } tests it.
            feedback:true (see above).
   Matching: the longest phrase typed wins. A room noun beats an "any" noun and an item
   of the same length; an NPC in the room beats a noun of the same length.
   Nothing matched: the engine answers for its own commands; a verb of this add-on
   says the engine's "You don't see that." (free).
   ------------------------------------------------------------------------- */
{
  const lc = o => Object.fromEntries(Object.entries(o || {}).map(([k, v]) => [k.toLowerCase(), v]));   // "Take" in data = take
  const K = G.keys || {}, GR = G.groups || {};
  const N = Object.fromEntries(Object.entries(G.nouns || {}).map(([id, n]) => [id, lc(n)]));
  const CAT = Object.fromEntries(Object.entries(G.categories || {}).map(([c, t]) => [c, lc(t)]));
  const ANY = lc(G.anywhere), ALONE = lc(G.alone), RV = Object.fromEntries(Object.keys(G.rooms).map(r => [r, lc(G.rooms[r].verbs)]));
  const norm = s => ` ${s.toLowerCase().replace(/-/g, " ").replace(/\s+/g, " ").trim()} `;
  const has = (arg, phrase) => norm(arg).includes(norm(phrase));
  const key = k => !k || k.split("&").every(p => p[0] === "!" ? !test(K[p.slice(1)]) : test(K[p]));
  let noun = null;   // the noun being answered (for the SOLVED key)
  const pick = (L, arg = "") => [...(L || [])].reverse().find(([k, , obj]) =>
    key(k === "SOLVED" || k?.includes("SOLVED") ? k.replace("SOLVED", noun?.puzzle || "ESCAPE") : k) && (!obj || obj.split("|").some(o => has(arg, o))));
  const visible = id => { const n = N[id]; return (n.at === S.room || n.at === "any") && !!pick(n.examine); };
  const phrases = T => id => [T[id].name, ...(T[id].aliases || []), ...T[id].name.split(" ")];
  // every thing the line names: [{ id, kind, len, pos }]
  const scan = arg => {
    const a = norm(arg), hits = [];
    const add = (id, kind, ps, rank) => ps.forEach(p => { const i = a.indexOf(norm(p)); if (i >= 0) hits.push({ id, kind, len: p.split(" ").length, pos: i, rank }); });
    Object.keys(N).filter(visible).forEach(id => add(id, "noun", N[id].words, N[id].at === "any" ? 1 : 3));
    [...inv(), ...at(G.items)].forEach(id => add(id, "item", phrases(G.items)(id), 2));
    at(G.npcs).forEach(id => add(id, "npc", phrases(G.npcs)(id), 4));
    // things somewhere else: only a longer phrase than anything here can pick them ("jaguar gate" in the enclosure)
    Object.keys(N).filter(id => !visible(id)).forEach(id => add(id, "away", N[id].words, 0));
    Object.keys(G.items).filter(id => S.loc[id] !== "player" && S.loc[id] !== S.room).forEach(id => add(id, "away", [G.items[id].name, ...(G.items[id].aliases || [])], 0));
    return hits;
  };
  const best = hits => hits.sort((x, y) => y.len - x.len || y.rank - x.rank)[0];
  const thing = h => h.kind === "noun" ? N[h.id] : h.kind === "item" ? G.items[h.id] : G.npcs[h.id];
  const CORE = ["take", "drop", "examine", "use", "talk", "go", "look", "wait"];   // the engine has its own "not here" for these
  let verb = "";
  const refund = () => { if (!FREE.includes(verb) && S.count.turns > 0) S.count.turns--; };
  const say = (line, dull) => { if (!line) return false; print(txt(line[1])); if (line[3] === "free" || tourFree()) refund(); else if (dull) feedback(); return true; };
  const tourFree = () => G.tourFree && key("TOUR");
  const verbKeys = v => [v, ...(GR[v] || []), "*"];
  const lines = (T, v, arg) => { for (const k of verbKeys(v)) { const l = pick(T?.[k], arg); if (l) return l; } };
  // "examine <room next door>"
  const nextDoor = a => {
    const ex = G.rooms[S.room].exits || {}, to = Object.values(ex).map(x => typeof x === "string" ? x : x.to);
    const r = to.find(r => (G.rooms[r].words || []).some(w => has(a, w)));
    if (!r) return false;
    const rv = G.rooms[r].revisit, t = G.throughDoor ? G.throughDoor(r)   // the game's own view through the doorway
      : key("ESCAPE") ? pick(G.rooms[r].again)?.[1] : typeof rv === "string" || Array.isArray(rv) ? txt(rv) : "";   // a revisit built from parts has no one line
    return !!t && (print("Through the doorway: " + txt(t)), true);
  };
  // "examine <a word the room's text used>": that sentence, looked at closer
  const words = s => ` ${s.replace(/\[(\w+)\]/g, (m, id) => (G.items[id] || G.npcs[id])?.name || id).toLowerCase().replace(/'s\b/g, "").replace(/[^\p{L}\p{N}' ]+/gu, " ").replace(/\s+/g, " ")} `;   // "mama" finds "Mama's"
  let heard = [];
  const SYS = new Set(JSON.stringify(G.messages || {}).match(/"(?:[^"\\]|\\.)*"/g)?.map(q => JSON.parse(q)) || []);   // the engine's own lines
  const closer = a => {
    const C = G.lookCloser, x = a.toLowerCase().trim();
    if (!C || x.length < 3) return false;
    const was = noun, texts = [...C.room(S.room), ...(heard.room === S.room ? heard : [])];
    for (const id in N) if (N[id].at === S.room) { noun = N[id]; for (const v of ["examine", "smell", "listen"]) texts.push(pick(N[id][v])?.[1]); }
    noun = was;
    for (const v of ["smell", "listen"]) texts.push(pick(RV[S.room][v])?.[1]);
    [...at(G.items), ...at(G.npcs)].forEach(id => texts.push((G.items[id] || G.npcs[id]).desc));
    const stem = x.replace(/e?s$/, ""), forms = [x, x + "s", x + "es", stem].map(f => ` ${f} `).concat(stem.length >= 5 ? [` ${stem}`] : []);   // "sparks": "sparking"
    const hit = texts.map(t => t && txt(t)).filter(Boolean).flatMap(t => t.split(/(?<=[.!?]["”]?)\s+|\n+/))
      .find(t => forms.some(f => words(t).includes(f)));
    return !!hit && (print(txt(C.prefix) + hit), true);
  };
  const own = new Set(["ask", "tell", ...Object.values(N).flatMap(n => Object.keys(n)), ...Object.values(CAT).flatMap(Object.keys),
    ...Object.keys(ANY), ...Object.keys(ALONE), ...Object.values(RV).flatMap(Object.keys),
    ...(G.strikeVerbs || [])].filter(v => !["at", "cat", "words", "strike", "puzzle", "examine", "*", "handle", "feed"].includes(v)));
  // rotations, notes, first looks: saved in S.nouns
  const ladder = L => { const k = "ladder:" + JSON.stringify(L), n = S.nouns.turn[k] || 0; S.nouns.turn[k] = n + 1; return L[Math.min(n, L.length - 1)]; };
  // the run report goes inside the ending's block (G.report)
  const BONUS = G.report?.bonus || [], COUNTED = [...Object.keys(N), ...(G.report?.counted || [])].filter(id => !BONUS.includes(id));
  const part = p => p?.list ? p.list.map(txt).filter(Boolean).join(", ") || txt(p.none || "") : txt(p);
  const end0 = EFFECT.end;
  EFFECT.end = v => {
    if (!G.report) return end0(v);
    S.count.examined = S.nouns.seen.filter(id => COUNTED.includes(id)).length; S.count.examinable = COUNTED.length;
    S.count.bonus = S.nouns.seen.filter(id => BONUS.includes(id)).length; S.count.bonuses = BONUS.length;
    const rep = G.report.lines.map(l => l.map(part).join("")).filter(Boolean).join("\n");
    end0([{ text: txt(v) + "\n\n" + rep + txt(G.report.after || "") }]);
  };
  const rotate = L => { const k = JSON.stringify(L[0]).slice(0, 60), n = S.nouns.turn[k] || 0; S.nouns.turn[k] = n + 1; return L[n % L.length]; };
  let pending = false, fb = false, extras = null, npcLines = 0, warned = false;
  const feedback = force => { if (G.feedback && key("ESCAPE") && (force || !FREE.includes(verb))) fb = true; };   // printed at the end of the turn
  const run0 = run;
  run = e => { run0(e); if (pending) { pending = false; feedback(true); } };
  const plain = print;   // the engine's "you can't go that way", reworded by the messages add-on
  print = (t, c) => { plain(t, c);
    if (t === G.nowhere && key("ESCAPE")) feedback(true);
    if ((G.warnings || []).includes(t)) warned = true;
    if ((G.npcLines || []).includes(t)) npcLines++;
    if (c !== "cmd" && typeof t === "string" && /\p{Ll}/u.test(t) && !SYS.has(t) && !t.startsWith("Through the doorway: ") && !t.startsWith(G.lookCloser?.prefix || "\0")) {   // what was read in this room
      if (heard.room !== S.room) heard = Object.assign([], { room: S.room });
      heard.push(t); } };
  // after the room text in ESCAPE: tails, then Big Tony's band line
  const band = () => { const B = G.bands, type = B?.rooms[S.room], k = type && Object.keys(B.lines).find(key);
    return k && B.lines[k][type] && txt(rotate(B.lines[k][type])); };
  const look0 = CMDS.look;
  CMDS.look = a => {
    look0(a);
    if (!key("ESCAPE")) return;
    const done = new Set(), list = [];
    for (const T of G.tails?.[S.room] || []) {
      const id = S.room + ":" + T.text.slice(0, 30);
      if (!key(T.key) || (T.group && done.has(T.group)) || (T.once && S.nouns.once.includes(id))) continue;
      if (T.group) done.add(T.group);
      list.push({ ...T, id });
    }
    extras = [...list.filter(T => T.top), ...list.filter(T => !T.top)];   // checkpoint lines first, then marks, then the band
  };
  const endTurn = () => {
    if (extras) {
      let room = (G.extras ?? 9) - npcLines;
      for (const T of extras) { if (room <= 0) break; if (T.once) S.nouns.once.push(T.id); print(txt(T.text)); room--; }
      const b = room > 0 && !warned && band(); if (b) print(b);
    }
    if (fb && !warned) print(txt(rotate(G.feedback)));
    extras = null; fb = false; npcLines = 0; warned = false;
  };
  const react = id => { const first = !S.nouns.seen.includes(id);
    if (first) S.nouns.seen.push(id);
    if (first && G.reactions?.[id] && test(G.reactIf)) print(txt(G.reactions[id])); };
  // "ask <npc> about <topic>"
  const ask = a => {
    for (const npc in G.topics || {}) { const P = G.topics[npc];
      if (!test(P.when)) continue;
      if (P.coldKey && key(P.coldKey)) return say([null, rotate(P.cold)]);
      const one = a.split(" ").map(w => w.replace(/s$/, "")).join(" ");   // "hippos" asks about the hippo
      const hits = P.list.flatMap(t => t.words.filter(w => has(a, w) || has(one, w)).map(w => ({ t, len: w.split(" ").length }))).sort((x, y) => y.len - x.len);
      return say(pick(hits[0]?.t.lines || P.other)); }
  };
  const commands = {};
  for (const v of own) if (!CMDS[v]) commands[v] = () => print("I don't understand that. Type 'help'.");
  const mine = v => own.has(v) || ["examine", "go", "wait", "say", "talk"].includes(v);
  function answer(v, a) {
    noun = null; verb = v;
    if ((v === "ask" || v === "tell") && ask(a)) return true;
    if (v === "say") {   // no question or checkpoint answered it: a topic if it names one, else talk
      for (const npc in G.topics || {}) { const P = G.topics[npc];
        if (!test(P.when)) continue;
        return P.list.some(t => t.words.some(w => has(a, w))) ? ask(a) : (exec("talk", npc), true); }
      return;
    }
    if (v === "wait") return key("ESCAPE") && say(pick(ANY.wait));
    if (!a) {   // the verb alone: this room's line, then the lone-verb line, then anywhere
      if (v === "examine" || v === "go") return;
      if (v === "listen" && !pick(RV[S.room][v]) && key("ESCAPE")) { const b = band(); if (b) return print(b), true; }
      const own = pick(RV[S.room][v]);
      return own ? say(own) : say(pick(ALONE[v]) || pick(ANY[v]), true);
    }
    if (v === "go" && (DIRS[a] || Object.values(DIRS).includes(a) || (G.rooms[S.room].exits || {})[a])) return;
    const all = scan(a), found = best([...all]), hits = all.filter(x => x.kind !== "away"), h = found?.kind === "away" ? null : found;
    if (!h) {
      if (v === "examine" && (nextDoor(a) || closer(a))) return true;
      const r = !found && pick(RV[S.room][v], a);
      if (r && r[2]) return say(r);                     // "swim in the fountain": a room line that names its own object
      if ((v === "listen" || v === "smell") && !found) return answer(v, "");   // "listen to the wind": the room's line
      if (CORE.includes(v) && !found) return;   // the engine answers its own commands
      return print("You don't see that."), refund(), true;
    }
    const t = thing(h);
    // strikes: a strike verb on a strike thing while the Don is watching
    if (key("TOUR") && G.strike) {
      const target = (G.strikeWith || []).includes(v) ? hits.find(x => thing(x).strike) : t.strike && h;
      if (target && ((G.strikeVerbs || []).includes(v) || (G.strikeWith || []).includes(v))) {
        S.nouns.notes.STRIKE3_BY = thing(target).strike;   // what caused it (for the L1 opener)
        S.nouns.notes.STRUCK = target.id;                   // and the thing itself
        run(G.strike); if (tourFree()) refund(); return true; }
    }
    if (v === "talk") return h.kind === "noun" ? say(lines(t, "talk", a) || lines(CAT[t.cat], "talk", a) || [null, "Nobody by that name around.", null, "free"]) : undefined;
    if (h.kind !== "noun" && v === "examine") {   // items and NPCs: the engine's own lines (or a first-look close-up)
      const close = G.firstLook?.[h.id] && !S.nouns.seen.includes(h.id);
      react(h.id); return close ? (print(txt(G.firstLook[h.id])), true) : undefined; }
    if (h.kind !== "noun" && !own.has(v) && v !== "go") return;
    if (h.kind === "noun") noun = t;
    if (v === "examine") { say(pick(t.examine)); react(h.id); return true; }
    const vv = v === "go" ? "enter" : v;
    const mineLine = h.kind === "noun" && (lines(t, vv, a) || (v === "go" && lines(t, "go", a)));
    if (mineLine) return say(mineLine);
    const line = lines(CAT[t.cat], v === "go" ? "push" : vv, a) || lines(ANY, vv, a);
    if (line) return say(line, true);
    if (v === "go") return exec("push", a), true;
    return say([null, "Nothing happens."], true);
  }
  addon({
    name: "nouns",
    commands,
    state: { turn: {}, notes: {}, seen: [], once: [] },
    conditions: { key: v => key(v), noted: o => Object.entries(o).every(([k, v]) => S.nouns.notes[k] === v) },
    effects: { rotate: L => print(txt(rotate(L))), ladder: L => print(txt(ladder(L))), note: o => Object.assign(S.nouns.notes, o), feedback: () => { pending = true; } },
    afterTurn: endTurn,
    before(v, a) {
      // a checkpoint: anything that costs a turn and reached here fails it. Note why, and let CAUGHT say it
      if (G.caught && test(G.caught.if) && !FREE.includes(v)) return (S.nouns.notes.CAUGHT_BY ??= G.caught.by(v, a)), true;
      if (mine(v)) return answer(v, a);
    },
    validate(need) {
      const check = (k, p) => k && k.split("&").forEach(x => { x = x.replace(/^!/, ""); need(x === "SOLVED" || x in K, p, `no key "${x}"`); });
      const walk = (L, p) => (L || []).forEach((l, i) => { check(l[0], `${p}[${i}]`); need(typeof l[1] === "string", `${p}[${i}]`, "needs text");
        [...l[1].matchAll(/\[(\w+)\]/g)].forEach(m => need(m[1] in G.items || m[1] in G.npcs, `${p}[${i}]`, `[${m[1]}] is not an item or NPC`)); });
      for (const id in N) { const n = N[id];
        need(n.at === "any" || n.at in G.rooms, `nouns.${id}.at`, `no room "${n.at}"`);
        need(n.cat in CAT, `nouns.${id}.cat`, `no category "${n.cat}"`);
        need((n.words || []).length, `nouns.${id}.words`, "needs words");
        for (const v in n) if (Array.isArray(n[v]) && v !== "words") walk(n[v], `nouns.${id}.${v}`); }
      for (const c in CAT) for (const v in CAT[c]) walk(CAT[c][v], `categories.${c}.${v}`);
      for (const T of ["anywhere", "alone"]) for (const v in G[T] || {}) walk(G[T][v], `${T}.${v}`);
      for (const r in G.rooms) { for (const v in G.rooms[r].verbs || {}) walk(G.rooms[r].verbs[v], `rooms.${r}.verbs.${v}`); walk(G.rooms[r].again, `rooms.${r}.again`); }
    }
  });
}
</script>

<script>
/* ---- ADD-ON: messages (reword the engine's own lines) ----------------------
   Data:  messages: { "engine line": TEXT | { rotate:[TEXT, ...] } }
            Whenever the engine prints that exact line, the game's TEXT is shown instead.
            A key ending in "*" matches every line that starts with the rest, and a "*"
            in the TEXT stands for the original line. An empty TEXT hides the line.
            rotate: the lines are shown in turn, then repeat.
          e.g. "I don't understand that. Type 'help'.": { rotate: ["Huh?", "Say again?"] }
               "Exits: *": [{ if: { flag: "blind" }, text: "" }, "*"]
   ------------------------------------------------------------------------- */
{
  const M = G.messages || {}, keys = Object.keys(M);
  const plain = print;
  print = (t, c) => {
    const k = keys.find(k => k.endsWith("*") ? t.startsWith(k.slice(0, -1)) : t === k);
    if (!k) return plain(t, c);
    const v = M[k], n = v.rotate ? (S.messages[k] || 0) : 0;
    if (v.rotate) S.messages[k] = n + 1;
    const out = txt(v.rotate ? v.rotate[n % v.rotate.length] : v).replace("*", () => t);
    if (out) plain(out, c);
  };
  addon({
    name: "messages",
    state: {},
    validate(need) { for (const k of keys) need(!M[k].rotate || M[k].rotate.length, `messages.${k}`, "rotate needs a list of lines"); }
  });
}
</script>
